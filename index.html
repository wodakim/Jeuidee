<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jelly Evolution</title>
    <style>
        /* CSS Reset & Basic Styling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000510; /* Deep sea dark blue */
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Game Container */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px); /* Reserve space for Ad */
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Ad Placeholder */
        #ad-placeholder {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #222;
            color: #888;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 12px;
            border-top: 1px solid #444;
            box-sizing: border-box;
        }

        /* UI Layer - sits above canvas */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px);
            pointer-events: none; /* Let touches pass through to canvas by default */
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Interactive Elements need pointer-events: auto */
        .interactive {
            pointer-events: auto;
        }

        /* HUD */
        #hud {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-box {
            background: rgba(0, 20, 40, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        #dna-container {
            width: 200px;
        }

        #dna-bar-bg {
            width: 100%;
            height: 10px;
            background: #111;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }

        #dna-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #00ff88);
            transition: width 0.3s ease-out;
        }

        /* Start Menu / Evolution Menu Overlay */
        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 20, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s;
        }

        /* EDITOR UI - Transparent Center for Preview */
        #editor-ui {
            background: transparent; /* See-through */
            justify-content: space-between; /* Panels on sides */
            padding-top: 0;
            pointer-events: none;
            flex-direction: row;
            align-items: stretch;
        }

        .editor-panels {
            /* Now just container for the panels layout */
            display: flex;
            width: 100%;
            height: 100%;
            justify-content: space-between;
            pointer-events: none;
        }

        .panel {
            background: rgba(0, 20, 40, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 0;
            padding: 20px;
            width: 250px; /* Fixed width sidebars */
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            pointer-events: auto; /* Clickable */
            backdrop-filter: blur(10px);
        }

        /* Adjust for mobile landscape */
        @media (max-width: 800px) and (orientation: landscape) {
            .panel { width: 180px; padding: 10px; }
            .part-icon { font-size: 20px; }
            .part-btn { padding: 10px; font-size: 0.8em; }
        }

        /* Portrait Mode Support (Mobile) */
        @media (orientation: portrait) {
            .editor-panels {
                flex-direction: column;
                pointer-events: none;
            }

            .panel {
                width: 100%;
                height: auto;
                max-height: 25%;
                flex-direction: row;
                padding: 10px;
                overflow-x: auto;
                overflow-y: hidden;
                box-sizing: border-box;
                align-items: center;
                justify-content: flex-start;
                gap: 15px;
            }

            /* Order: Parts on Top, Stats/Mutation on Bottom */
            .panel:first-child {
                order: 2;
                border-top: 1px solid rgba(0,255,255,0.3);
                border-bottom: none;
                flex-wrap: wrap;
                justify-content: center;
            }
            .panel:last-child {
                order: 1;
                border-bottom: 1px solid rgba(0,255,255,0.3);
                border-top: none;
            }

            .parts-grid {
                display: flex;
                flex-direction: row;
                width: auto;
                gap: 15px;
            }

            .part-btn {
                min-width: 80px;
                padding: 10px;
            }

            h3, h4 { display: none; } /* Save space */

            #trash-zone {
                bottom: 30%; /* Move up above bottom panel */
            }
        }

        .parts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
        }

        .part-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            cursor: grab; /* Draggable indicator */
            text-align: center;
            color: #fff;
            transition: all 0.2s;
            user-select: none;
        }

        .part-btn:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .part-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #00ffff;
        }

        .part-icon {
            font-size: 24px;
            margin-bottom: 5px;
        }

        #trash-zone {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            background: rgba(255, 0, 0, 0.3);
            border: 2px dashed red;
            border-radius: 50%;
            display: none; /* Flex when dragging */
            justify-content: center;
            align-items: center;
            color: red;
            font-weight: bold;
            pointer-events: auto;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important; /* Force hide layout */
        }

        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            color: #fff;
            margin-bottom: 15px;
        }

        button {
            background: linear-gradient(180deg, #00ccff, #0088cc);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 200, 255, 0.4);
            transition: transform 0.1s, filter 0.2s;
            text-transform: uppercase;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            filter: brightness(1.2);
        }

        button.diet-herbivore {
            background: linear-gradient(180deg, #44ff44, #00aa00);
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.4);
        }

        button.diet-carnivore {
            background: linear-gradient(180deg, #ff4444, #aa0000);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        /* Evolution Cards */
        .evo-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .evo-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 150px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .evo-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .evo-icon {
            width: 60px;
            height: 60px;
            background: #000;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border: 2px solid #fff;
        }

    </style>
</head>
<body>

    <!-- Game Container -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">

        <!-- HUD (Top Left/Right) -->
        <div id="hud" class="interactive">
            <div class="stat-box" id="dna-container">
                <div>DNA / EVOLUTION</div>
                <div id="dna-bar-bg"><div id="dna-bar-fill"></div></div>
            </div>
            <div class="stat-box">
                <div id="score-display">MASS: 10</div>
            </div>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" class="menu-overlay interactive">
            <h1>Neon Evolution</h1>

            <div id="continue-btn-container" style="display: none; margin-bottom: 20px;">
                <button onclick="continueGame()" style="background: linear-gradient(180deg, #ffcc00, #aa8800); box-shadow: 0 4px 15px rgba(255, 200, 0, 0.4);">CONTINUE EVOLUTION</button>
                <p style="font-size: 0.8em; color: #aaa;">- OR RESTART -</p>
            </div>

            <h2>Choose Your Diet</h2>
            <div style="display: flex; gap: 20px;">
                <button class="diet-herbivore" onclick="startGame('herbivore')">Herbivore<br><span style="font-size: 0.7em">(Eats Plants)</span></button>
                <button class="diet-carnivore" onclick="startGame('carnivore')">Carnivore<br><span style="font-size: 0.7em">(Eats Meat & Meat)</span></button>
            </div>
        </div>

        <!-- Evolution Editor (New) -->
        <div id="editor-ui" class="menu-overlay interactive hidden">

            <div class="editor-panels">
                <!-- Left: Body & Stats -->
                <div class="panel">
                    <h3 style="margin-top:0">🧬 EDITOR</h3>
                    <h4 style="color:#00ffff">Mutation</h4>

                    <button class="part-btn" onclick="editorAction('color')" style="width: 100%; margin-bottom: 10px;">
                        <div class="part-icon">🎨</div>
                        Color
                    </button>
                    <button class="part-btn" onclick="editorAction('vertebra')" style="width: 100%;">
                        <div class="part-icon">🦴</div>
                        + Vertebra
                    </button>

                    <div style="flex:1"></div>
                    <button onclick="closeEditor()" style="width:100%; padding:20px; background: #00ff88; color: #000; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">RESUME</button>
                </div>

                <!-- Right: Parts Inventory -->
                <div class="panel">
                    <h3>PARTS DNA</h3>
                    <div class="parts-grid">
                        <div class="part-btn" ontouchstart="startDrag(event, 'fin')" onmousedown="startDrag(event, 'fin')">
                            <div class="part-icon">⚡</div>
                            <div>Fin</div>
                        </div>
                        <div class="part-btn" ontouchstart="startDrag(event, 'spike')" onmousedown="startDrag(event, 'spike')">
                            <div class="part-icon">⚔️</div>
                            <div>Spike</div>
                        </div>
                        <div class="part-btn" ontouchstart="startDrag(event, 'eye')" onmousedown="startDrag(event, 'eye')">
                            <div class="part-icon">👁️</div>
                            <div>Eye</div>
                        </div>
                        <div class="part-btn" ontouchstart="startDrag(event, 'poison')" onmousedown="startDrag(event, 'poison')">
                            <div class="part-icon">🤢</div>
                            <div>Poison</div>
                        </div>
                    </div>

                    <div style="margin-top: auto; width: 100%; text-align: center; opacity: 0.7;">
                        <p>Drag parts to creature</p>
                    </div>
                </div>
            </div>

            <div id="trash-zone">TRASH</div>
        </div>

    </div>

    <!-- Ad Space -->
    <div id="ad-placeholder">
        AD SPACE (BANNER)
    </div>

    <script>
        // --- VANILLA JS GAME ENGINE ---

        // Constants
        const WORLD_SIZE = 4000;
        const CELL_BASE_RADIUS = 20;

        // Game State
        window.state = {
            running: false,
            lastTime: 0,

            // Player
            player: {
                x: WORLD_SIZE / 2,
                y: WORLD_SIZE / 2,
                radius: CELL_BASE_RADIUS,
                mass: 10,
                speed: 200,
                color: '#ffffff',
                vx: 0,
                vy: 0,
                diet: 'herbivore',
                dna: 0,
                maxDna: 100,
                upgrades: { fins: 0, spikes: 0 },
                creature: null // CreatureBody instance
            },

            // Camera
            camera: {
                x: 0,
                y: 0,
                zoom: 1,
                targetZoom: 1
            },

            // Input
            input: {
                active: false,
                startX: 0,
                startY: 0,
                currX: 0,
                currY: 0,
                angle: 0,
                distance: 0
            },

            // Editor State
            editor: {
                active: false,
                dragging: null, // { type, partRef }
                dragX: 0,
                dragY: 0
            },

            // Entities
            foods: [],
            enemies: [],
            particles: []
        };

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 50; // Ad space
        }
        window.addEventListener('resize', resize);
        resize();

        // --- MATH HELPERS ---
        const MathUtils = {
            lerp: (a, b, t) => a + (b - a) * t,
            clamp: (val, min, max) => Math.min(Math.max(val, min), max),
            dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
            randomRange: (min, max) => Math.random() * (max - min) + min,
            angleDist: (a, b) => {
                const p = Math.PI * 2;
                return (b - a + p) % p;
            }
        };

        // --- PARTICLE SYSTEM ---
        class ParticleSystem {
            constructor() {
                this.particles = [];
            }

            emit(x, y, color, count = 10, speed = 100) {
                for(let i=0; i<count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const v = Math.random() * speed;
                    this.particles.push({
                        x: x, y: y,
                        vx: Math.cos(angle) * v,
                        vy: Math.sin(angle) * v,
                        life: 1.0,
                        color: color,
                        size: Math.random() * 3 + 1
                    });
                }
            }

            update(dt) {
                for(let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt * 2; // Fade out speed

                    if (p.life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for(const p of this.particles) {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        const particles = new ParticleSystem();

        // --- PARALLAX ATMOSPHERE ---
        class ParallaxLayer {
            constructor(scrollFactor, count, range, type) {
                this.scrollFactor = scrollFactor;
                this.items = [];
                this.type = type; // 'deep' or 'mid'

                for(let i=0; i<count; i++) {
                    this.items.push({
                        x: MathUtils.randomRange(-range, range),
                        y: MathUtils.randomRange(-range, range),
                        size: type === 'deep' ? MathUtils.randomRange(600, 1500) : MathUtils.randomRange(2, 10), // Bigger giants
                        alpha: type === 'deep' ? MathUtils.randomRange(0.02, 0.08) : MathUtils.randomRange(0.1, 0.4),
                        vx: MathUtils.randomRange(-10, 10) // Drift
                    });
                }
            }

            draw(ctx, cameraX, cameraY, zoom) {
                ctx.save();
                // Apply Parallax translation
                const px = -cameraX * this.scrollFactor;
                const py = -cameraY * this.scrollFactor;

                ctx.translate(px, py);
                // Scale around center... strictly simpler to just draw?
                // The parallax items are "in world space" but move slower.

                // Correction: We are inside a camera transform already?
                // No, we usually draw parallax BEFORE camera transform or handle it manually.
                // Let's render parallax manually in screen space or modified world space.
                // Easiest: Draw relative to camera center.

                const cx = canvas.width / 2;
                const cy = canvas.height / 2;

                this.items.forEach(p => {
                    // Wrap around screen? No, infinite feel needs tiling or huge range.
                    // For now, simple huge range is enough for 4000 world.

                    // Effective position
                    let dx = p.x - cameraX * this.scrollFactor;
                    let dy = p.y - cameraY * this.scrollFactor;

                    // Draw relative to center (zoom affects spacing)
                    // If we want depth, zoom should affect scale less for distant objects?
                    // Standard 2D parallax: position is scaled by scrollFactor.

                    // Simple approach: Draw in World Space but shift position.
                    // Wait, render() applies camera transform.
                    // We need to inverse that or draw before it.
                    // Let's draw `bgDeep` and `bgMid` inside render(), but adjust coordinates.
                });
                ctx.restore();
            }
        }

        // We'll implement the drawing logic directly in render() for simplicity with the camera transform.
        const bgOminousItems = [];
        const bgDeepItems = [];
        const bgMidItems = [];

        // --- ALGAE FOREST (Hiding Spots) ---
        class Algae {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.sway = Math.random() * Math.PI * 2;
            }

            update(dt) {
                this.sway += dt;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = 'rgba(0, 255, 100, 0.1)';
                ctx.shadowColor = 'rgba(0, 255, 100, 0.3)';
                ctx.shadowBlur = 30;

                // Draw Cloud
                ctx.beginPath();
                // Rough cloud shape
                for(let i=0; i<8; i++) {
                    const angle = (i / 8) * Math.PI * 2;
                    const r = this.radius + Math.sin(this.sway + i) * 20;
                    const px = Math.cos(angle) * r;
                    const py = Math.sin(angle) * r;
                    if(i===0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.fill();

                // Draw Strands
                ctx.strokeStyle = 'rgba(0, 255, 100, 0.4)';
                ctx.lineWidth = 3;
                for(let i=0; i<5; i++) {
                    const offset = (i - 2) * 20;
                    ctx.beginPath();
                    ctx.moveTo(offset, 20);
                    ctx.quadraticCurveTo(
                        offset + Math.sin(this.sway + i) * 30, -50,
                        offset + Math.sin(this.sway * 1.5 + i) * 60, -120
                    );
                    ctx.stroke();
                }
                ctx.restore();
            }
        }
        const algaeForests = [];

        function initBackground() {
            // Ominous Giants (Very Deep)
            for(let i=0; i<5; i++) {
                bgOminousItems.push({
                    x: MathUtils.randomRange(-2000, WORLD_SIZE + 2000),
                    y: MathUtils.randomRange(-2000, WORLD_SIZE + 2000),
                    r: MathUtils.randomRange(500, 1200), // Reduced size
                    color: Math.random() > 0.5 ? '#441111' : '#112211' // Slightly brighter
                });
            }

            // Deep shapes
            for(let i=0; i<20; i++) {
                bgDeepItems.push({
                    x: MathUtils.randomRange(-1000, WORLD_SIZE + 1000),
                    y: MathUtils.randomRange(-1000, WORLD_SIZE + 1000),
                    r: MathUtils.randomRange(300, 800)
                });
            }
            // Mid bubbles
            for(let i=0; i<100; i++) {
                bgMidItems.push({
                    x: MathUtils.randomRange(-500, WORLD_SIZE + 500),
                    y: MathUtils.randomRange(-500, WORLD_SIZE + 500),
                    r: MathUtils.randomRange(2, 8)
                });
            }

            // Algae
            for(let i=0; i<15; i++) {
                algaeForests.push(new Algae(
                    MathUtils.randomRange(0, WORLD_SIZE),
                    MathUtils.randomRange(0, WORLD_SIZE),
                    MathUtils.randomRange(100, 200)
                ));
            }
        }
        initBackground();

        // --- CREATURE ENGINE (Advanced Spine & Skin) ---
        class Vertebra {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.relX = x;
                this.relY = y;
            }
        }

        class BodyPart {
            constructor(type, vertebraIndex, angleOffset, distOffset, mirrored = false) {
                this.type = type; // 'spike', 'fin', 'eye', 'poison'
                this.vertebraIndex = vertebraIndex;
                this.angleOffset = angleOffset;
                this.distOffset = distOffset; // Distance from surface
                this.mirrored = mirrored;
                this.wobble = Math.random() * 10;
            }

            draw(ctx, creatureX, creatureY, spine, dt, color, isEditor) {
                this.wobble += dt * 5;
                const v = spine[this.vertebraIndex] || spine[0];
                const angle = 0; // Future: Spine rotation

                const drawOne = (mirror) => {
                    const side = mirror ? -1 : 1;
                    const theta = angle + this.angleOffset * side;

                    // Attach to surface: V.pos + Radius
                    const surfaceDist = v.radius + (this.distOffset || 0);
                    const px = creatureX + v.relX + Math.cos(theta) * surfaceDist;
                    const py = creatureY + v.relY + Math.sin(theta) * surfaceDist;

                    ctx.save();
                    ctx.translate(px, py);
                    ctx.rotate(theta + (this.type === 'fin' ? Math.sin(this.wobble)*0.2 : 0) + (mirror ? Math.PI : 0));

                    // Draw Selection Highlight (Editor)
                    if (isEditor) {
                        ctx.strokeStyle = '#ffff00';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(-10, -10, 20, 20);
                    }

                    ctx.fillStyle = color;
                    ctx.shadowColor = color;
                    ctx.shadowBlur = 15;

                    if (this.type === 'spike') {
                        ctx.beginPath();
                        ctx.moveTo(0, -5); ctx.lineTo(25, 0); ctx.lineTo(0, 5);
                        ctx.fill();
                    } else if (this.type === 'fin') {
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.quadraticCurveTo(15, -15, 35, 0);
                        ctx.quadraticCurveTo(15, 15, 0, 0);
                        ctx.fill();
                    } else if (this.type === 'eye') {
                        ctx.fillStyle = '#fff';
                        ctx.beginPath(); ctx.arc(5, 0, 8, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#000';
                        ctx.beginPath(); ctx.arc(8, 0, 3, 0, Math.PI*2); ctx.fill();
                    }
                    ctx.restore();
                };

                drawOne(false);
                if (this.mirrored) drawOne(true);
            }
        }

        class CreatureBody {
            constructor(spineConfig) {
                this.spine = [];
                this.parts = [];
                // We no longer use a single SoftBody for the whole creature.
                // We use Metaballs skinning in draw().

                if (spineConfig && spineConfig.length > 0) {
                    spineConfig.forEach(v => this.spine.push(new Vertebra(v.x, v.y, v.radius)));
                } else {
                    this.spine.push(new Vertebra(0, 0, CELL_BASE_RADIUS));
                }

                // Animation phase for breathing
                this.breath = 0;
            }

            addVertebra(radius = 20) {
                const last = this.spine[this.spine.length - 1];
                // Add behind, slightly smaller?
                this.spine.push(new Vertebra(last.relX - radius * 1.5, last.relY, radius));
            }

            addPart(type) {
                // Default place on head
                this.parts.push(new BodyPart(type, 0, 0, 0, true));
            }

            update(dt, vx, vy, mass) {
                this.breath += dt * 2;

                // FLUID SPINE PHYSICS (Inverse Kinematics / Drag)

                // The head (spine[0]) is always at 0,0 relative.
                // We update subsequent nodes to trail behind.

                // We need to apply "world velocity" influence to relative nodes to simulate drag.
                // If creature moves RIGHT (vx > 0), relative nodes should drift LEFT.
                const dragForceX = -vx * dt * 0.5;
                const dragForceY = -vy * dt * 0.5;

                for(let i=1; i<this.spine.length; i++) {
                    const prev = this.spine[i-1];
                    const curr = this.spine[i];

                    // 1. Apply Drag (Inertia)
                    curr.relX += dragForceX;
                    curr.relY += dragForceY;

                    // 2. Constraint Solving (Distance Constraint)
                    // "Gummi" feel: spacing isn't rigid, it's a spring.
                    const spacing = (prev.radius + curr.radius) * 0.7; // Overlap slightly
                    const dx = curr.relX - prev.relX;
                    const dy = curr.relY - prev.relY;
                    const dist = Math.hypot(dx, dy);

                    if (dist > 0) {
                        // Spring correction
                        // If too far, pull in. If too close, push out.
                        const difference = spacing - dist;
                        const percent = difference / dist / 2; // Split adjustment? No, prev is fixed (parent)

                        // Strict follow (Snake) vs Soft (Jelly)
                        // Use Lerp for softness
                        const stiffness = 10 * dt;

                        const offsetX = dx * percent;
                        const offsetY = dy * percent;

                        // Move current towards ideal position
                        // Target position relative to prev
                        const targetAngle = Math.atan2(dy, dx);
                        const targetX = prev.relX + Math.cos(targetAngle) * spacing;
                        const targetY = prev.relY + Math.sin(targetAngle) * spacing;

                        curr.relX = MathUtils.lerp(curr.relX, targetX, stiffness);
                        curr.relY = MathUtils.lerp(curr.relY, targetY, stiffness);
                    }
                }
            }

            draw(ctx, x, y, color, isEditor = false) {
                // 1. Draw Skin (Interpolation Algorithm)
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.fillStyle = color;

                ctx.beginPath();

                if (this.spine.length === 1) {
                    ctx.arc(x + this.spine[0].relX, y + this.spine[0].relY, this.spine[0].radius, 0, Math.PI*2);
                } else {
                    // Interpolate circles between vertebrae to fill gaps smoothly
                    // This creates a perfect tube/worm look without complex hull math artifacts

                    for (let i = 0; i < this.spine.length - 1; i++) {
                        const curr = this.spine[i];
                        const next = this.spine[i+1];

                        const p1x = x + curr.relX;
                        const p1y = y + curr.relY;
                        const p2x = x + next.relX;
                        const p2y = y + next.relY;

                        const dist = MathUtils.dist(p1x, p1y, p2x, p2y);
                        const steps = Math.ceil(dist / 5); // 1 circle every 5px

                        for(let s=0; s<=steps; s++) {
                            const t = s / steps;
                            const cx = MathUtils.lerp(p1x, p2x, t);
                            const cy = MathUtils.lerp(p1y, p2y, t);
                            const cr = MathUtils.lerp(curr.radius, next.radius, t);

                            ctx.moveTo(cx + cr, cy);
                            ctx.arc(cx, cy, cr, 0, Math.PI*2);
                        }
                    }
                }

                ctx.fill();
                ctx.restore();

                // 2. Editor Overlay (Green Vertebrae)
                if (isEditor) {
                    ctx.save();
                    this.spine.forEach(v => {
                        const px = x + v.relX;
                        const py = y + v.relY;

                        // Bone
                        ctx.fillStyle = '#00ff00';
                        ctx.globalAlpha = 0.5;
                        ctx.beginPath();
                        ctx.arc(px, py, v.radius * 0.8, 0, Math.PI*2); // Inner bone
                        ctx.fill();

                        // Connector
                        // ctx.strokeStyle = '#00ff00';
                        // ctx.stroke();
                    });
                    ctx.restore();
                }

                // 3. Draw Parts
                const dt = 0.016;
                this.parts.forEach(p => p.draw(ctx, x, y, this.spine, dt, color, isEditor));
            }
        }

        // --- SOFT BODY ENGINE (Legacy/Base) ---
        // Kept for Enemies and underlying logic
        class SoftBody {
            constructor(radius, segments = 12, stiffness = 5, damping = 0.5) {
                this.radius = radius;
                this.baseRadius = radius;
                this.segments = segments;
                this.points = [];
                this.stiffness = stiffness;
                this.damping = damping;
                this.wobblePhase = Math.random() * Math.PI * 2;

                // Init points
                for(let i=0; i<segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    this.points.push({
                        x: Math.cos(angle) * radius,
                        y: Math.sin(angle) * radius,
                        vx: 0,
                        vy: 0,
                        baseX: Math.cos(angle) * radius,
                        baseY: Math.sin(angle) * radius,
                        angle: angle
                    });
                }
            }

            update(dt, velocityX, velocityY, mass) {
                // Idle Wobble (Breathing)
                this.wobblePhase += dt * 2;
                const breath = Math.sin(this.wobblePhase) * 2;

                // Velocity Deformation (Squash/Stretch)
                // If moving fast, stretch along velocity vector
                const speed = Math.hypot(velocityX, velocityY);
                const angle = Math.atan2(velocityY, velocityX);
                const stretchFactor = Math.min(speed / 300, 0.3); // Cap stretch

                for(let i=0; i<this.segments; i++) {
                    const p = this.points[i];

                    // 1. Target Position (Base Shape + Breathing)
                    let tx = p.baseX * (1 + breath * 0.05 / (mass * 0.1));
                    let ty = p.baseY * (1 + breath * 0.05 / (mass * 0.1));

                    // 2. Apply Deformation (Stretch along movement)
                    // Rotate point to align with movement direction
                    // Simple hack: Just pull points that are "behind" slightly
                    // Better: Elliptical transform?
                    // Let's stick to Spring Physics:
                    // Inertia: Points lag behind movement

                    // Spring Force: Pull towards target (tx, ty)
                    const ax = (tx - p.x) * this.stiffness;
                    const ay = (ty - p.y) * this.stiffness;

                    // Inertia Force: Inverse of parent velocity
                    // Points have "drag"
                    const dragX = -velocityX * 0.05;
                    const dragY = -velocityY * 0.05;

                    p.vx += (ax + dragX) * dt;
                    p.vy += (ay + dragY) * dt;

                    // Damping
                    p.vx *= (1 - this.damping * dt * 10); // drag
                    p.vy *= (1 - this.damping * dt * 10);

                    // Integrate
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                }
            }

            draw(ctx, x, y, color) {
                // Main Body (Neon Glow)
                ctx.save();
                ctx.globalCompositeOperation = 'lighter'; // Additive blending for glow
                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.fillStyle = color;

                // Construct path
                ctx.beginPath();
                const gx = (i) => x + this.points[i].x;
                const gy = (i) => y + this.points[i].y;

                // Smooth loop
                ctx.moveTo((gx(0) + gx(this.segments-1))/2, (gy(0) + gy(this.segments-1))/2);
                for(let i=0; i<this.segments; i++) {
                    const next = (i + 1) % this.segments;
                    const mx = (gx(i) + gx(next)) / 2;
                    const my = (gy(i) + gy(next)) / 2;
                    ctx.quadraticCurveTo(gx(i), gy(i), mx, my);
                }
                ctx.closePath();
                ctx.fill();
                ctx.restore();

                // Internal Details (Nucleus/Organelles) - Parallax effect
                ctx.save();
                ctx.globalCompositeOperation = 'source-over'; // Standard draw on top
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';

                // Calculate "lag" position for nucleus
                // Based on average point deformation vs center
                let avgX = 0, avgY = 0;
                this.points.forEach(p => { avgX += p.x; avgY += p.y; });
                avgX /= this.segments;
                avgY /= this.segments;

                // Nucleus
                ctx.beginPath();
                ctx.arc(x + avgX * 0.5, y + avgY * 0.5, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Small organelles
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                for(let i=0; i<3; i++) {
                    const angle = (i / 3) * Math.PI * 2 + this.wobblePhase;
                    const ox = x + avgX * 0.8 + Math.cos(angle) * this.radius * 0.5;
                    const oy = y + avgY * 0.8 + Math.sin(angle) * this.radius * 0.5;
                    ctx.beginPath();
                    ctx.arc(ox, oy, this.radius * 0.15, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // --- GAME LOOP ---
        function gameLoop(timestamp) {
            if (!state.running) {
                requestAnimationFrame(gameLoop);
                return;
            }

            // Delta time with safety clamp (max 100ms) to prevent spiraling physics/camera
            let dt = (timestamp - state.lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;

            state.lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            // Pause logic if Editor is open
            if (state.editor.active) {
                return;
            }

            // Update Particles
            particles.update(dt);

            // Update Algae
            algaeForests.forEach(a => a.update(dt));

            // 1. Player Movement
            if (state.input.active) {
                const speed = state.player.speed;
                const moveX = Math.cos(state.input.angle) * speed * (state.input.distance / 50);
                const moveY = Math.sin(state.input.angle) * speed * (state.input.distance / 50);

                state.player.vx = MathUtils.lerp(state.player.vx, moveX, 5 * dt);
                state.player.vy = MathUtils.lerp(state.player.vy, moveY, 5 * dt);
            } else {
                // Friction
                state.player.vx = MathUtils.lerp(state.player.vx, 0, 5 * dt);
                state.player.vy = MathUtils.lerp(state.player.vy, 0, 5 * dt);
            }

            state.player.x += state.player.vx * dt;
            state.player.y += state.player.vy * dt;

            // World Bounds (Soft Bounce)
            if (state.player.x < 0 || state.player.x > WORLD_SIZE) state.player.vx *= -1;
            if (state.player.y < 0 || state.player.y > WORLD_SIZE) state.player.vy *= -1;
            state.player.x = MathUtils.clamp(state.player.x, 0, WORLD_SIZE);
            state.player.y = MathUtils.clamp(state.player.y, 0, WORLD_SIZE);

            // Creature Update
            // Resize logic moved to CreatureBody... or handled by re-init?
            // For now, let's just sync radius
            const scaleFactor = Math.sqrt(state.player.mass / 10);

            if (!state.player.creature) {
                state.player.creature = new CreatureBody([{x:0, y:0, radius: CELL_BASE_RADIUS}]);
            }

            // Check if mass changed significantly to resize visuals?
            // Simplified: Rebuild skin if scale changed
            // Actually, CreatureBody should handle scaling.
            // For now, let's just update the creature.

            state.player.creature.update(dt, state.player.vx, state.player.vy, state.player.mass);

            // 2. Camera Follow
            // Target Position: Center on player
            const targetCamX = state.player.x - (canvas.width / 2) / state.camera.zoom;
            const targetCamY = state.player.y - (canvas.height / 2) / state.camera.zoom;

            state.camera.x = MathUtils.lerp(state.camera.x, targetCamX, 5 * dt);
            state.camera.y = MathUtils.lerp(state.camera.y, targetCamY, 5 * dt);

            // Zoom based on size (Gigantism Effect)
            // Slower falloff using damped curve: 1 / (1 + (scale - 1) * 0.3)
            state.camera.targetZoom = Math.max(0.2, 1 / (1 + (scaleFactor - 1) * 0.3));
            state.camera.zoom = MathUtils.lerp(state.camera.zoom, state.camera.targetZoom, 2 * dt);

            // 3. Collision Detection (Food)
            for (let i = state.foods.length - 1; i >= 0; i--) {
                const f = state.foods[i];
                const d = MathUtils.dist(state.player.x, state.player.y, f.x, f.y);

                // Eat Range
                if (d < state.player.radius + f.radius) {
                    // Check Diet
                    let canEat = false;
                    if (state.player.diet === 'herbivore' && f.type === 'plant') canEat = true;
                    if (state.player.diet === 'carnivore' && f.type === 'meat') canEat = true;

                    if (canEat) {
                        // Particle FX
                        particles.emit(f.x, f.y, f.type === 'plant' ? '#00ff00' : '#ff0000', 5, 50);

                        state.foods.splice(i, 1);
                        state.player.mass += 0.5;
                        state.player.dna += 1;
                        updateUI();

                        // Spawn replacement
                        spawnFood(1);
                    }
                }
            }

            // 4. Update & Draw Enemies + Collisions
            for (let i = state.enemies.length - 1; i >= 0; i--) {
                const e = state.enemies[i];
                e.update(dt);

                // Algae Logic (Safety / Damage)
                let inAlgae = false;
                for(const alg of algaeForests) {
                    if (MathUtils.dist(e.x, e.y, alg.x, alg.y) < alg.radius) {
                        inAlgae = true;
                        if (e.type === 'aggressor') {
                            // Carnivores take damage/slow in algae
                            e.vx *= 0.9;
                            e.vy *= 0.9;
                            // e.mass -= dt; // Slowly die?
                        }
                    }
                }

                // AI Adjustment: Carnivores flee algae?

                // Enemy Eating Food Logic
                // Simple collision with food
                for (let j = state.foods.length - 1; j >= 0; j--) {
                    const f = state.foods[j];
                    if (MathUtils.dist(e.x, e.y, f.x, f.y) < e.radius + f.radius) {
                        // Only eat matching diet
                        let canEat = false;
                        if (e.type === 'grazer' && f.type === 'plant') canEat = true;
                        if (e.type === 'aggressor' && f.type === 'meat') canEat = true;

                        if (canEat) {
                            state.foods.splice(j, 1);
                            e.evolutionPoints += 1;
                            // Chance to spawn food to replenish
                            if(Math.random() < 0.1) spawnFood(1);
                        }
                    }
                }

                // Collision with Player
                const d = MathUtils.dist(state.player.x, state.player.y, e.x, e.y);
                if (d < state.player.radius + e.radius) {
                    // Player Larger?
                    if (state.player.mass > e.mass * 1.1) {
                        if (state.player.diet === 'carnivore') {
                            // Splat FX
                            particles.emit(e.x, e.y, e.color, 15, 150);

                            state.enemies.splice(i, 1);
                            state.player.mass += e.mass * 0.2;
                            state.player.dna += 10;
                            updateUI();
                            spawnEnemies(1);
                        } else {
                            // Herbivore Push
                            const angle = Math.atan2(e.y - state.player.y, e.x - state.player.x);
                            e.vx = Math.cos(angle) * 300;
                            e.vy = Math.sin(angle) * 300;
                        }
                    }
                    else if (e.mass > state.player.mass * 1.1) {
                        // Player Smaller -> Take Damage
                        const angle = Math.atan2(state.player.y - e.y, state.player.x - e.x);
                        state.player.vx = Math.cos(angle) * 400;
                        state.player.vy = Math.sin(angle) * 400;

                        // Player Damage
                        state.player.mass -= 1; // Lose mass
                        if (state.player.mass <= 5) {
                            // Game Over Logic (Respawn for now)
                            alert("YOU DIED - Eaten by a larger predator");
                            window.location.reload();
                        }
                        updateUI();
                    }
                }
            }

            // Check Evolution
            if (state.player.dna >= state.player.maxDna) {
                openEditor();
            }
        }

        function render() {
            // Clear Screen
            ctx.fillStyle = '#000510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // --- ATMOSPHERE (Parallax) ---

            // 1. Ominous Giants (ScrollFactor 0.05, Heavy Blur)
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            const ominousZoom = MathUtils.lerp(1, state.camera.zoom, 0.05);
            ctx.scale(ominousZoom, ominousZoom);
            ctx.translate(-state.camera.x * 0.05, -state.camera.y * 0.05);

            ctx.filter = 'blur(40px)';

            bgOminousItems.forEach(b => {
                b.x += 0.05; // Very slow drift
                ctx.fillStyle = b.color;
                ctx.globalAlpha = 0.3; // Increased visibility
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // 2. Draw Deep Layer (ScrollFactor 0.1, Blurred)
            ctx.save();
            // Deep Layer Transform
            ctx.translate(canvas.width/2, canvas.height/2);
            // Parallax scale: zoom affects it less to fake distance
            const deepZoom = MathUtils.lerp(1, state.camera.zoom, 0.1);
            ctx.scale(deepZoom, deepZoom);
            ctx.translate(-state.camera.x * 0.1, -state.camera.y * 0.1);

            // Apply Blur (Expensive! Limit item count or use pre-blurred sprites if needed)
            // For 20 items it should be fine on modern phones.
            ctx.filter = 'blur(20px)';
            ctx.fillStyle = '#001133';

            bgDeepItems.forEach(b => {
                // Animate drift
                b.x += 0.1; // Slow drift

                ctx.globalAlpha = 0.3;
                ctx.beginPath();
                // Draw irregular blob? Circle is fine with blur
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();

            // Draw Mid Layer (ScrollFactor 0.5)
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.scale(state.camera.zoom, state.camera.zoom);
            ctx.translate(-state.camera.x * 0.5, -state.camera.y * 0.5);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            bgMidItems.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.restore();


            // --- WORLD ENTITIES ---
            ctx.save();

            // Apply Main Camera Transform
            ctx.scale(state.camera.zoom, state.camera.zoom);
            ctx.translate(-state.camera.x, -state.camera.y);

            // Draw Algae (Background Layer of World)
            algaeForests.forEach(a => a.draw(ctx));

            // Draw Food
            state.foods.forEach(f => {
                ctx.fillStyle = f.type === 'plant' ? '#00ff00' : '#ff0000';
                ctx.shadowColor = f.type === 'plant' ? '#00ff00' : '#ff0000';
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0; // Reset
            });

            // Draw Enemies
            state.enemies.forEach(e => e.draw(ctx));

            // Draw Particles (Under player?)
            particles.draw(ctx);

            // Draw Player (Creature)
            if (state.player.creature) {
                state.player.creature.draw(ctx, state.player.x, state.player.y, state.player.color);
            }

            // Draw Eyes (Direction)
            const eyeOffset = state.player.radius * 0.6;
            const angle = Math.atan2(state.player.vy, state.player.vx); // Look direction

            // Left Eye
            const lx = state.player.x + Math.cos(angle - 0.5) * eyeOffset;
            const ly = state.player.y + Math.sin(angle - 0.5) * eyeOffset;

            // Right Eye
            const rx = state.player.x + Math.cos(angle + 0.5) * eyeOffset;
            const ry = state.player.y + Math.sin(angle + 0.5) * eyeOffset;

            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0; // Reset for eyes
            ctx.beginPath();
            ctx.arc(lx, ly, state.player.radius * 0.25, 0, Math.PI * 2);
            ctx.arc(rx, ry, state.player.radius * 0.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(lx, ly, state.player.radius * 0.1, 0, Math.PI * 2);
            ctx.arc(rx, ry, state.player.radius * 0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Editor Drag Preview
            if (state.editor.active && state.editor.dragging) {
                ctx.save();
                // Draw Icon at finger pos (Screen Space)
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const icon = state.editor.dragging.type === 'fin' ? '⚡' :
                             state.editor.dragging.type === 'spike' ? '⚔️' :
                             state.editor.dragging.type === 'eye' ? '👁️' : '🤢';
                ctx.fillText(icon, state.editor.dragX, state.editor.dragY);
                ctx.restore();
            }

            // Draw Virtual Joystick (Overlay UI)
            if (state.input.active) {
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;

                // Base
                ctx.beginPath();
                ctx.arc(state.input.startX, state.input.startY, 50, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Stick
                const stickX = state.input.startX + Math.cos(state.input.angle) * state.input.distance;
                const stickY = state.input.startY + Math.sin(state.input.angle) * state.input.distance;

                ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(stickX, stickY, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // --- ENTITY CLASSES ---
        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'aggressor' or 'grazer'
                this.radius = MathUtils.randomRange(15, 30);
                this.mass = (this.radius / CELL_BASE_RADIUS) * 10;
                this.speed = this.type === 'aggressor' ? 150 : 100;
                this.color = this.type === 'aggressor' ? '#ff0055' : '#00aaff';
                this.vx = 0;
                this.vy = 0;

                // Soft Body
                this.body = new SoftBody(this.radius, this.type === 'aggressor' ? 8 : 12, 5, 0.5);

                // AI State
                this.state = 'wander';
                this.stateTimer = 0;
                this.targetX = x;
                this.targetY = y;
            }

            update(dt) {
                // AI Logic (Steering)
                this.stateTimer -= dt;
                if (this.stateTimer <= 0) {
                    this.pickNewState();
                }

                let steerX = 0, steerY = 0;

                if (this.state === 'wander') {
                    // Search for food nearby
                    let closestFood = null;
                    let minDist = 300; // Sight range

                    for (const f of state.foods) {
                        // Check diet compatibility
                        const canEat = (this.type === 'grazer' && f.type === 'plant') || (this.type === 'aggressor' && f.type === 'meat');
                        if (!canEat) continue;

                        const d = MathUtils.dist(this.x, this.y, f.x, f.y);
                        if (d < minDist) {
                            minDist = d;
                            closestFood = f;
                        }
                    }

                    if (closestFood) {
                        // Seek Food
                        const dx = closestFood.x - this.x;
                        const dy = closestFood.y - this.y;
                        steerX = dx / minDist * this.speed;
                        steerY = dy / minDist * this.speed;
                    } else {
                        // Standard Wander
                        const dx = this.targetX - this.x;
                        const dy = this.targetY - this.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < 50) this.pickNewState();

                        steerX = dx / dist * (this.speed * 0.5); // Slower wander
                        steerY = dy / dist * (this.speed * 0.5);
                    }
                }
                else if (this.state === 'chase' && this.type === 'aggressor') {
                    // Chase Player
                    const dx = state.player.x - this.x;
                    const dy = state.player.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    steerX = dx / dist * (this.speed * 1.5); // Sprint
                    steerY = dy / dist * (this.speed * 1.5);
                }
                else if (this.state === 'flee') {
                    // Flee from Player
                    const dx = this.x - state.player.x;
                    const dy = this.y - state.player.y;
                    const dist = Math.hypot(dx, dy);
                    steerX = dx / dist * (this.speed * 1.2);
                    steerY = dy / dist * (this.speed * 1.2);
                }

                // Apply Steering
                this.vx = MathUtils.lerp(this.vx, steerX, 2 * dt);
                this.vy = MathUtils.lerp(this.vy, steerY, 2 * dt);

                // Update Position
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // World Bounds
                if (this.x < 0 || this.x > WORLD_SIZE) this.vx *= -1;
                if (this.y < 0 || this.y > WORLD_SIZE) this.vy *= -1;
                this.x = MathUtils.clamp(this.x, 0, WORLD_SIZE);
                this.y = MathUtils.clamp(this.y, 0, WORLD_SIZE);

                // Update Body
                this.body.update(dt, this.vx, this.vy, this.mass);
            }

            pickNewState() {
                this.stateTimer = MathUtils.randomRange(2, 5);

                const distToPlayer = MathUtils.dist(this.x, this.y, state.player.x, state.player.y);

                if (this.type === 'aggressor') {
                    // Chase if close and bigger
                    if (distToPlayer < 400 && this.mass > state.player.mass) {
                        this.state = 'chase';
                    } else {
                        this.state = 'wander';
                        this.targetX = this.x + MathUtils.randomRange(-300, 300);
                        this.targetY = this.y + MathUtils.randomRange(-300, 300);
                    }
                } else {
                    // Grazer: Flee if close and smaller
                    if (distToPlayer < 300 && this.mass < state.player.mass) {
                        this.state = 'flee';
                    } else {
                        this.state = 'wander';
                        this.targetX = this.x + MathUtils.randomRange(-300, 300);
                        this.targetY = this.y + MathUtils.randomRange(-300, 300);
                    }
                }
            }

            draw(ctx) {
                if (this.body) {
                    this.body.draw(ctx, this.x, this.y, this.color);
                }
                // Eye (Simple)
                const angle = Math.atan2(this.vy, this.vx);
                const ex = this.x + Math.cos(angle) * this.radius * 0.5;
                const ey = this.y + Math.sin(angle) * this.radius * 0.5;

                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(ex, ey, this.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(ex, ey, this.radius * 0.1, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // --- SPAWNING ---
        function spawnFood(count) {
            for (let i = 0; i < count; i++) {
                state.foods.push({
                    x: MathUtils.randomRange(0, WORLD_SIZE),
                    y: MathUtils.randomRange(0, WORLD_SIZE),
                    radius: 5,
                    type: Math.random() > 0.5 ? 'plant' : 'meat'
                });
            }
        }

        function spawnEnemies(count) {
            for (let i = 0; i < count; i++) {
                const x = MathUtils.randomRange(0, WORLD_SIZE);
                const y = MathUtils.randomRange(0, WORLD_SIZE);
                // Avoid spawn on player
                if (MathUtils.dist(x, y, state.player.x, state.player.y) < 500) continue;

                const type = Math.random() > 0.4 ? 'grazer' : 'aggressor';
                state.enemies.push(new Enemy(x, y, type));
            }
        }

        // --- UI & LOGIC CONNECTIONS ---
        function updateUI() {
            document.getElementById('score-display').innerText = `MASS: ${Math.floor(state.player.mass)}`;
            const percent = Math.min(100, (state.player.dna / state.player.maxDna) * 100);
            document.getElementById('dna-bar-fill').style.width = `${percent}%`;
        }

        window.startGame = (diet) => {
            state.player.diet = diet;

            // Reset Player
            state.player.x = WORLD_SIZE / 2;
            state.player.y = WORLD_SIZE / 2;
            state.player.mass = 10;
            state.player.dna = 0;

            // Tint based on diet
            state.player.color = diet === 'carnivore' ? '#ff4444' : '#44ff44';

            // Spawn initial world
            state.foods = [];
            state.enemies = [];
            spawnFood(300);
            spawnEnemies(20);

            // Hide Menu, Start Loop
            document.getElementById('start-menu').classList.add('hidden');
            state.running = true;
            state.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        };

        window.continueGame = () => {
             // Basic implementation for now
             document.getElementById('start-menu').classList.add('hidden');
             state.running = true;
             state.lastTime = performance.now();
             requestAnimationFrame(gameLoop);
        };

        // --- EDITOR LOGIC ---
        function openEditor() {
            state.editor.active = true;
            document.getElementById('editor-ui').classList.remove('hidden');
            state.running = true;

            // Force Camera Center for Editing
            state.camera.targetZoom = 2.5;
            state.camera.zoom = 2.5; // Apply immediately since update() is paused

            // Snap X/Y to player immediately
            state.camera.x = state.player.x - (canvas.width / 2) / 2.5;
            state.camera.y = state.player.y - (canvas.height / 2) / 2.5;
        }

        window.closeEditor = () => {
            state.editor.active = false;
            document.getElementById('editor-ui').classList.add('hidden');
            state.lastTime = performance.now();

            // Reset DNA cost only on exit? Or pay as you go?
            // "DNA is full" -> Open Editor.
            // Let's reset DNA now assuming changes were made.
            state.player.dna = 0;
            state.player.maxDna = Math.floor(state.player.maxDna * 1.5);
            updateUI();
            saveGameData();
        };

        // Editor Actions (Buttons)
        window.editorAction = (action) => {
            if (action === 'color') {
                state.player.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            } else if (action === 'vertebra') {
                state.player.creature.addVertebra();
                // Consume evolution turn immediately
                state.player.dna = 0;
                state.player.maxDna = Math.floor(state.player.maxDna * 1.5);
                updateUI();
                saveGameData();
                closeEditor();
            }
        };

        // Drag & Drop Logic
        window.startDrag = (e, type) => {
            // e.preventDefault(); // Stop text selection
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            state.editor.dragging = { type: type };
            state.editor.dragX = clientX;
            state.editor.dragY = clientY;

            document.getElementById('trash-zone').style.display = 'flex';
        };

        function dropPart() {
            const drag = state.editor.dragging;
            if (!drag) return;

            const mx = state.editor.dragX;
            const my = state.editor.dragY;

            // Check Trash
            const trash = document.getElementById('trash-zone').getBoundingClientRect();
            if (mx >= trash.left && mx <= trash.right && my >= trash.top && my <= trash.bottom) {
                // Delete logic: If dragging an existing part (future feature), remove it.
                // For now, dragging from inventory just cancels the add.
            } else {
                // Place on Creature (Raycast)
                const zoom = state.camera.zoom;
                const worldMX = state.camera.x + mx / zoom;
                const worldMY = state.camera.y + my / zoom;

                let closestV = null;
                let minDist = Infinity;
                let bestIdx = 0;

                // Check distance to spine nodes in World Space
                state.player.creature.spine.forEach((v, idx) => {
                    const vx = state.player.x + v.relX;
                    const vy = state.player.y + v.relY;

                    const d = MathUtils.dist(worldMX, worldMY, vx, vy);
                    if (d < minDist) {
                        minDist = d;
                        closestV = v;
                        bestIdx = idx;
                    }
                });

                // Only attach if close enough (e.g. within 3x radius for easier placement)
                if (closestV && minDist < closestV.radius * 4) {
                    const vx = state.player.x + closestV.relX;
                    const vy = state.player.y + closestV.relY;
                    const angle = Math.atan2(worldMY - vy, worldMX - vx);

                    state.player.creature.parts.push(new BodyPart(drag.type, bestIdx, angle, 5, false));
                    saveGameData(); // Auto-save on edit
                }
            }

            state.editor.dragging = null;
            document.getElementById('trash-zone').style.display = 'none';
        }

        // --- SAVE SYSTEM ---
        window.saveGameData = () => {
            if (!state.player.creature) return;

            const data = {
                mass: state.player.mass,
                dna: state.player.dna,
                maxDna: state.player.maxDna,
                color: state.player.color,
                diet: state.player.diet,
                spine: state.player.creature.spine.map(v => ({x: v.relX, y: v.relY, radius: v.radius})),
                parts: state.player.creature.parts.map(p => ({
                    type: p.type,
                    vertebraIndex: p.vertebraIndex,
                    angleOffset: p.angleOffset,
                    distOffset: p.distOffset,
                    mirrored: p.mirrored
                }))
            };
            localStorage.setItem('jellyEvoSave', JSON.stringify(data));
        };

        window.loadGameData = () => {
            const raw = localStorage.getItem('jellyEvoSave');
            if (raw) {
                try {
                    const data = JSON.parse(raw);
                    state.player.mass = data.mass || 10;
                    state.player.dna = data.dna || 0;
                    state.player.maxDna = data.maxDna || 100;
                    state.player.color = data.color || '#fff';
                    state.player.diet = data.diet || 'herbivore';

                    // Reconstruct Creature
                    if (data.spine && data.spine.length > 0) {
                        state.player.creature = new CreatureBody(data.spine);
                    } else {
                        state.player.creature = new CreatureBody([{x:0, y:0, radius: CELL_BASE_RADIUS}]);
                    }

                    if (data.parts) {
                        state.player.creature.parts = data.parts.map(p =>
                            new BodyPart(p.type, p.vertebraIndex, p.angleOffset, p.distOffset, p.mirrored)
                        );
                    }

                    updateUI();
                    return true; // Loaded successfully
                } catch (e) {
                    console.error("Save Load Error", e);
                    return false;
                }
            }
            return false;
        };

        // Init Input (Fixed for Touch Drag)
        // Redefine setupInput to use window listeners for drag support
        function setupInput() {
            const handleStart = (x, y) => {
                if (state.editor.active) return; // Editor handles its own clicks via UI buttons

                state.input.active = true;
                state.input.startX = x;
                state.input.startY = y;
                state.input.currX = x;
                state.input.currY = y;
                state.input.distance = 0;
            };

            const handleMove = (x, y) => {
                // Editor Drag Logic (Global)
                if (state.editor.active && state.editor.dragging) {
                    state.editor.dragX = x;
                    state.editor.dragY = y;
                    return;
                }

                if (!state.input.active) return;
                state.input.currX = x;
                state.input.currY = y;

                const dx = x - state.input.startX;
                const dy = y - state.input.startY;
                state.input.angle = Math.atan2(dy, dx);
                state.input.distance = Math.min(MathUtils.dist(0, 0, dx, dy), 50);
            };

            const handleEnd = () => {
                if (state.editor.active && state.editor.dragging) {
                    dropPart();
                    return;
                }
                state.input.active = false;
                state.input.distance = 0;
            };

            // Touch Listeners (Window-level to catch UI drags)
            window.addEventListener('touchstart', e => {
                // If touching canvas, game input. If touching UI, handled by UI.
                if(e.target === canvas) {
                    e.preventDefault();
                    handleStart(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, {passive: false});

            window.addEventListener('touchmove', e => {
                // Always prevent default scrolling if interacting
                if (state.input.active || (state.editor.active && state.editor.dragging) || e.target === canvas) {
                    e.preventDefault();
                }

                // If dragging UI element, we still want updates
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }, {passive: false});

            window.addEventListener('touchend', e => {
                handleEnd();
            });

            // Mouse Listeners
            canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
            window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', handleEnd);
        }

        setupInput();

        // Check Save
        window.onload = () => {
             if (loadGameData()) {
                 // Resume button instead of start?
                 // For now, show menu, but "Continue" is enabled
                 const btn = document.getElementById('continue-btn-container');
                 if(btn) btn.style.display = 'block';
             }
        };

    </script>
</body>
