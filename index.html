<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jelly Evolution</title>
    <style>
        /* CSS Reset & Basic Styling */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000510; /* Deep sea dark blue */
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Game Container */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px); /* Reserve space for Ad */
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Ad Placeholder */
        #ad-placeholder {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #222;
            color: #888;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-size: 12px;
            border-top: 1px solid #444;
            box-sizing: border-box;
        }

        /* Landscape Enforcement Overlay */
        #orientation-lock {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            text-align: center;
        }

        /* Logic to show orientation lock on portrait */
        @media screen and (orientation: portrait) {
            #orientation-lock { display: flex; }
        }

        /* UI Layer - sits above canvas */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 50px);
            pointer-events: none; /* Let touches pass through to canvas by default */
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Interactive Elements need pointer-events: auto */
        .interactive {
            pointer-events: auto;
        }

        /* HUD */
        #hud {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-box {
            background: rgba(0, 20, 40, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(4px);
        }

        #dna-container {
            width: 200px;
        }

        #dna-bar-bg {
            width: 100%;
            height: 10px;
            background: #111;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }

        #dna-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #00ff88);
            transition: width 0.3s ease-out;
        }

        /* Start Menu / Evolution Menu Overlay */
        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 10, 20, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h2 {
            color: #fff;
            margin-bottom: 15px;
        }

        button {
            background: linear-gradient(180deg, #00ccff, #0088cc);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 200, 255, 0.4);
            transition: transform 0.1s, filter 0.2s;
            text-transform: uppercase;
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            filter: brightness(1.2);
        }

        button.diet-herbivore {
            background: linear-gradient(180deg, #44ff44, #00aa00);
            box-shadow: 0 4px 15px rgba(0, 255, 0, 0.4);
        }

        button.diet-carnivore {
            background: linear-gradient(180deg, #ff4444, #aa0000);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        /* Evolution Cards */
        .evo-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .evo-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            width: 150px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .evo-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .evo-icon {
            width: 60px;
            height: 60px;
            background: #000;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border: 2px solid #fff;
        }

    </style>
</head>
<body>

    <!-- Landscape Lock -->
    <div id="orientation-lock">
        <div style="font-size: 40px; margin-bottom: 20px;">📱↺</div>
        <h1>Please Rotate Your Device</h1>
        <p>This experience is designed for Landscape mode.</p>
    </div>

    <!-- Game Container -->
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">

        <!-- HUD (Top Left/Right) -->
        <div id="hud" class="interactive">
            <div class="stat-box" id="dna-container">
                <div>DNA / EVOLUTION</div>
                <div id="dna-bar-bg"><div id="dna-bar-fill"></div></div>
            </div>
            <div class="stat-box">
                <div id="score-display">MASS: 10</div>
            </div>
        </div>

        <!-- Start Menu -->
        <div id="start-menu" class="menu-overlay interactive">
            <h1>Neon Evolution</h1>

            <div id="continue-btn-container" style="display: none; margin-bottom: 20px;">
                <button onclick="continueGame()" style="background: linear-gradient(180deg, #ffcc00, #aa8800); box-shadow: 0 4px 15px rgba(255, 200, 0, 0.4);">CONTINUE EVOLUTION</button>
                <p style="font-size: 0.8em; color: #aaa;">- OR RESTART -</p>
            </div>

            <h2>Choose Your Diet</h2>
            <div style="display: flex; gap: 20px;">
                <button class="diet-herbivore" onclick="startGame('herbivore')">Herbivore<br><span style="font-size: 0.7em">(Eats Plants)</span></button>
                <button class="diet-carnivore" onclick="startGame('carnivore')">Carnivore<br><span style="font-size: 0.7em">(Eats Meat & Meat)</span></button>
            </div>
        </div>

        <!-- Evolution Menu (Hidden initially) -->
        <div id="evo-menu" class="menu-overlay interactive hidden">
            <h1>Evolve!</h1>
            <h2>Choose an Upgrade</h2>
            <div class="evo-container">
                <div class="evo-card" onclick="evolve('speed')">
                    <div class="evo-icon" style="border-color: #00ffff; color: #00ffff;">⚡</div>
                    <h3>Fins</h3>
                    <p>+ Speed</p>
                </div>
                <div class="evo-card" onclick="evolve('attack')">
                    <div class="evo-icon" style="border-color: #ff0055; color: #ff0055;">⚔️</div>
                    <h3>Spikes</h3>
                    <p>+ Damage</p>
                </div>
                <div class="evo-card" onclick="evolve('color')">
                    <div class="evo-icon" style="border-color: #ff00ff; color: #ff00ff;">🎨</div>
                    <h3>Color</h3>
                    <p>Random Mutation</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Ad Space -->
    <div id="ad-placeholder">
        AD SPACE (BANNER)
    </div>

    <script>
        // --- VANILLA JS GAME ENGINE ---

        // Constants
        const WORLD_SIZE = 4000;
        const CELL_BASE_RADIUS = 20;

        // Game State
        const state = {
            running: false,
            lastTime: 0,

            // Player
            player: {
                x: WORLD_SIZE / 2,
                y: WORLD_SIZE / 2,
                radius: CELL_BASE_RADIUS,
                mass: 10,
                speed: 200,
                color: '#ffffff',
                vx: 0,
                vy: 0,
                diet: 'herbivore',
                dna: 0,
                maxDna: 100,
                upgrades: { fins: 0, spikes: 0 }
            },

            // Camera
            camera: {
                x: 0,
                y: 0,
                zoom: 1,
                targetZoom: 1
            },

            // Input
            input: {
                active: false,
                startX: 0,
                startY: 0,
                currX: 0,
                currY: 0,
                angle: 0,
                distance: 0
            },

            // Entities
            foods: [],
            enemies: [],
            particles: []
        };

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 50; // Ad space
        }
        window.addEventListener('resize', resize);
        resize();

        // --- MATH HELPERS ---
        const MathUtils = {
            lerp: (a, b, t) => a + (b - a) * t,
            clamp: (val, min, max) => Math.min(Math.max(val, min), max),
            dist: (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1),
            randomRange: (min, max) => Math.random() * (max - min) + min
        };

        // --- INPUT HANDLING ---
        function setupInput() {
            const handleStart = (x, y) => {
                state.input.active = true;
                state.input.startX = x;
                state.input.startY = y;
                state.input.currX = x;
                state.input.currY = y;
                state.input.distance = 0;
            };

            const handleMove = (x, y) => {
                if (!state.input.active) return;
                state.input.currX = x;
                state.input.currY = y;

                const dx = x - state.input.startX;
                const dy = y - state.input.startY;
                state.input.angle = Math.atan2(dy, dx);
                state.input.distance = Math.min(MathUtils.dist(0, 0, dx, dy), 50); // Cap stick distance
            };

            const handleEnd = () => {
                state.input.active = false;
                state.input.distance = 0;
            };

            // Touch
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                handleStart(e.touches[0].clientX, e.touches[0].clientY);
            }, {passive: false});

            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                handleMove(e.touches[0].clientX, e.touches[0].clientY);
            }, {passive: false});

            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                handleEnd();
            });

            // Mouse (for testing)
            canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
            window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', handleEnd);
        }

        // --- GAME LOOP ---
        function gameLoop(timestamp) {
            if (!state.running) {
                requestAnimationFrame(gameLoop);
                return;
            }

            const dt = (timestamp - state.lastTime) / 1000;
            state.lastTime = timestamp;

            update(dt);
            render();

            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            // 1. Player Movement
            if (state.input.active) {
                const speed = state.player.speed;
                const moveX = Math.cos(state.input.angle) * speed * (state.input.distance / 50);
                const moveY = Math.sin(state.input.angle) * speed * (state.input.distance / 50);

                state.player.vx = MathUtils.lerp(state.player.vx, moveX, 5 * dt);
                state.player.vy = MathUtils.lerp(state.player.vy, moveY, 5 * dt);
            } else {
                // Friction
                state.player.vx = MathUtils.lerp(state.player.vx, 0, 5 * dt);
                state.player.vy = MathUtils.lerp(state.player.vy, 0, 5 * dt);
            }

            state.player.x += state.player.vx * dt;
            state.player.y += state.player.vy * dt;

            // World Bounds (Soft Bounce)
            if (state.player.x < 0 || state.player.x > WORLD_SIZE) state.player.vx *= -1;
            if (state.player.y < 0 || state.player.y > WORLD_SIZE) state.player.vy *= -1;
            state.player.x = MathUtils.clamp(state.player.x, 0, WORLD_SIZE);
            state.player.y = MathUtils.clamp(state.player.y, 0, WORLD_SIZE);

            // 2. Camera Follow
            // Target Position: Center on player
            const targetCamX = state.player.x - (canvas.width / 2) / state.camera.zoom;
            const targetCamY = state.player.y - (canvas.height / 2) / state.camera.zoom;

            state.camera.x = MathUtils.lerp(state.camera.x, targetCamX, 5 * dt);
            state.camera.y = MathUtils.lerp(state.camera.y, targetCamY, 5 * dt);

            // Zoom based on size (Gigantism Effect)
            // Scale inversely proportional to player radius growth
            const scaleFactor = Math.sqrt(state.player.mass / 10);
            state.player.radius = CELL_BASE_RADIUS * scaleFactor;

            state.camera.targetZoom = Math.max(0.2, 1 / (scaleFactor * 0.8));
            state.camera.zoom = MathUtils.lerp(state.camera.zoom, state.camera.targetZoom, 2 * dt);

            // 3. Collision Detection (Food)
            for (let i = state.foods.length - 1; i >= 0; i--) {
                const f = state.foods[i];
                const d = MathUtils.dist(state.player.x, state.player.y, f.x, f.y);

                // Eat Range
                if (d < state.player.radius + f.radius) {
                    // Check Diet
                    let canEat = false;
                    if (state.player.diet === 'herbivore' && f.type === 'plant') canEat = true;
                    if (state.player.diet === 'carnivore' && f.type === 'meat') canEat = true;

                    if (canEat) {
                        state.foods.splice(i, 1);
                        state.player.mass += 0.5;
                        state.player.dna += 1;
                        updateUI();

                        // Spawn replacement
                        spawnFood(1);
                    }
                }
            }

            // Check Evolution
            if (state.player.dna >= state.player.maxDna) {
                // Trigger Evolution Menu
                document.getElementById('evo-menu').classList.remove('hidden');
                state.running = false; // Pause
            }
        }

        function render() {
            // Clear Screen
            ctx.fillStyle = '#000510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();

            // Apply Camera Transform
            // Translate to center, scale, translate back
            ctx.scale(state.camera.zoom, state.camera.zoom);
            ctx.translate(-state.camera.x, -state.camera.y);

            // Draw World Grid (Reference)
            ctx.strokeStyle = '#112233';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let x = 0; x <= WORLD_SIZE; x += 200) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, WORLD_SIZE);
            }
            for (let y = 0; y <= WORLD_SIZE; y += 200) {
                ctx.moveTo(0, y);
                ctx.lineTo(WORLD_SIZE, y);
            }
            ctx.stroke();

            // Draw Food
            state.foods.forEach(f => {
                ctx.fillStyle = f.type === 'plant' ? '#00ff00' : '#ff0000';
                ctx.shadowColor = f.type === 'plant' ? '#00ff00' : '#ff0000';
                ctx.shadowBlur = 10;

                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0; // Reset
            });

            // Draw Player
            ctx.fillStyle = state.player.color;
            ctx.shadowColor = state.player.color;
            ctx.shadowBlur = 20;

            ctx.beginPath();
            ctx.arc(state.player.x, state.player.y, state.player.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw Eyes (Direction)
            const eyeOffset = state.player.radius * 0.6;
            const angle = Math.atan2(state.player.vy, state.player.vx); // Look direction

            // Left Eye
            const lx = state.player.x + Math.cos(angle - 0.5) * eyeOffset;
            const ly = state.player.y + Math.sin(angle - 0.5) * eyeOffset;

            // Right Eye
            const rx = state.player.x + Math.cos(angle + 0.5) * eyeOffset;
            const ry = state.player.y + Math.sin(angle + 0.5) * eyeOffset;

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(lx, ly, state.player.radius * 0.25, 0, Math.PI * 2);
            ctx.arc(rx, ry, state.player.radius * 0.25, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(lx, ly, state.player.radius * 0.1, 0, Math.PI * 2);
            ctx.arc(rx, ry, state.player.radius * 0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Draw Virtual Joystick (Overlay UI)
            if (state.input.active) {
                ctx.save();
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;

                // Base
                ctx.beginPath();
                ctx.arc(state.input.startX, state.input.startY, 50, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Stick
                const stickX = state.input.startX + Math.cos(state.input.angle) * state.input.distance;
                const stickY = state.input.startY + Math.sin(state.input.angle) * state.input.distance;

                ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(stickX, stickY, 20, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // --- SPAWNING ---
        function spawnFood(count) {
            for (let i = 0; i < count; i++) {
                state.foods.push({
                    x: MathUtils.randomRange(0, WORLD_SIZE),
                    y: MathUtils.randomRange(0, WORLD_SIZE),
                    radius: 5,
                    type: Math.random() > 0.5 ? 'plant' : 'meat'
                });
            }
        }

        // --- UI & LOGIC CONNECTIONS ---
        function updateUI() {
            document.getElementById('score-display').innerText = `MASS: ${Math.floor(state.player.mass)}`;
            const percent = Math.min(100, (state.player.dna / state.player.maxDna) * 100);
            document.getElementById('dna-bar-fill').style.width = `${percent}%`;
        }

        window.startGame = (diet) => {
            state.player.diet = diet;

            // Reset Player
            state.player.x = WORLD_SIZE / 2;
            state.player.y = WORLD_SIZE / 2;
            state.player.mass = 10;
            state.player.dna = 0;

            // Tint based on diet
            state.player.color = diet === 'carnivore' ? '#ff4444' : '#44ff44';

            // Spawn initial world
            state.foods = [];
            spawnFood(300);

            // Hide Menu, Start Loop
            document.getElementById('start-menu').classList.add('hidden');
            state.running = true;
            state.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        };

        window.continueGame = () => {
             // Basic implementation for now
             document.getElementById('start-menu').classList.add('hidden');
             state.running = true;
             state.lastTime = performance.now();
             requestAnimationFrame(gameLoop);
        };

        window.evolve = (type) => {
            if (type === 'speed') state.player.speed += 50;
            if (type === 'size') state.player.mass += 20;
            if (type === 'color') state.player.color = `hsl(${Math.random() * 360}, 100%, 50%)`;

            state.player.dna = 0;
            state.player.maxDna = Math.floor(state.player.maxDna * 1.5);
            updateUI();

            document.getElementById('evo-menu').classList.add('hidden');
            state.running = true;
            state.lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        };

        // Init Input
        setupInput();

        // Check Save (Mock)
        window.onload = () => {
             // Mock save check
        };

    </script>
</body>
</html>
