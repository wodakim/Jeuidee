            if (active) {
                this.enterPetriMode();
                this.updateDNA();
                this.refreshParts();
                this.sellMode = false;
                this.updateSellBtn();
            } else {
                this.exitPetriMode();
                this.hideResizeSlider();
            }
        }
    }

    enterPetriMode() {
        this.game.input.active = false;

        const source = this.game.creature;
        this.clone = {
            points: [],
            constraints: [],
            parts: JSON.parse(JSON.stringify(source.parts || [])),
            stats: source.stats,
            gameStats: source.gameStats,
            color: source.color
        };

        let y = 0;
        source.points.forEach((p, i) => {
            const spacing = (i === 0) ? 0 : 25;
            y += spacing;

            const cp = Physics.createPoint(0, y, p.baseRadius || 20, p.mass);
            cp.baseRadius = p.baseRadius || 20;
            cp.radius = cp.baseRadius;
            cp.initialBaseRadius = p.initialBaseRadius;
            cp.scaleFactor = p.scaleFactor;

            this.clone.points.push(cp);
        });

        const totalHeight = y;
        const startY = -totalHeight / 2;

        this.clone.points.forEach(p => {
            p.y += startY;
            p.oldY = p.y;
        });

        for(let i=1; i<this.clone.points.length; i++) {
            const p1 = this.clone.points[i-1];
            const p2 = this.clone.points[i];
            const dist = p2.y - p1.y;
            const c = Physics.createConstraint(p1, p2, 0.5, dist);
            c.baseLength = dist;
            this.clone.constraints.push(c);
        }

        this.game.camera.x = 0;
        this.game.camera.y = 0;
        this.fitCamera();
    }

    exitPetriMode() {
        const target = this.game.creature;

        if (target.points.length > 0) {
            const oldData = {
                parts: JSON.parse(JSON.stringify(target.parts)),
                points: target.points.map(p => ({
                    x: p.x, y: p.y,
                    baseRadius: p.baseRadius,
                    mass: p.mass,
                    radius: p.radius
                })),
                gameStats: { ...target.gameStats },
                color: target.color
            };

            const startX = target.points[0].x;
            const startY = target.points[0].y;

            this.game.spawnAlly(oldData, startX, startY);
        }

        target.parts = JSON.parse(JSON.stringify(this.clone.parts));

        while (target.points.length < this.clone.points.length) {
            const last = target.points[target.points.length-1];
            const prev = target.points[target.points.length-2] || last;
            const angle = Math.atan2(last.y - prev.y, last.x - prev.x);
            const r = last.radius;
            const newX = last.x + Math.cos(angle) * 20;
            const newY = last.y + Math.sin(angle) * 20;

            const p = Physics.createPoint(newX, newY, r, 1);
            p.baseRadius = r;
            target.points.push(p);

            const c = Physics.createConstraint(last, p, 0.5, 20);
            c.baseLength = 20;
            target.constraints.push(c);
        }

        for(let i=0; i<this.clone.points.length; i++) {
            const cp = this.clone.points[i];
            const tp = target.points[i];
            if (tp) {
                tp.baseRadius = cp.baseRadius;
                tp.initialBaseRadius = cp.initialBaseRadius;
                tp.scaleFactor = cp.scaleFactor;
            }
        }

        target.stats.calculate(target.parts);

        this.game.camera.targetZoom = 0.7;
        this.game.input.active = true;

        if (this.game.mate) {
            this.game.mate = null;
        }

        this.game.saveManager.save();
    }

    fitCamera() {
        const DISH_RADIUS = 600;
        const availableW = this.game.width;
        const availableH = this.game.height - 160;

        const margin = 1.1;
        const zoomX = availableW / (DISH_RADIUS * 2 * margin);
        const zoomY = availableH / (DISH_RADIUS * 2 * margin);

        let targetZoom = Math.min(zoomX, zoomY);
        targetZoom = Math.min(targetZoom, 3.0);
        targetZoom = Math.max(targetZoom, 0.2);

        this.game.camera.targetZoom = targetZoom;
        this.game.camera.x = 0;
        this.game.camera.y = 0;
        this.game.camera.vx = 0;
        this.game.camera.vy = 0;
    }

    zoomCamera(delta) {
        const cam = this.game.camera;
        let newZoom = cam.zoom + delta;
        newZoom = Math.min(newZoom, 3.0);
        newZoom = Math.max(newZoom, 0.2);

        cam.zoom = newZoom;
        cam.targetZoom = newZoom;
    }

    toggleSymmetry() {
        this.symmetry = !this.symmetry;
        const btn = document.getElementById('toggle-mirror-btn');
        btn.innerText = `SYM: ${this.symmetry ? 'ON' : 'OFF'}`;
        btn.style.borderColor = this.symmetry ? '#0f0' : '#0ff';
        btn.style.color = this.symmetry ? '#0f0' : '#0ff';
    }

    toggleSellMode() {
        this.sellMode = !this.sellMode;
        this.updateSellBtn();

        const txt = document.getElementById('editor-instruction');
        if (this.sellMode) {
             txt.innerText = "TAP PART TO SELL (REFUND 50%)";
             txt.style.color = "#fa0";
        } else {
             txt.innerText = "DRAG PARTS TO BODY • TAP BONE TO RESIZE";
             txt.style.color = "rgba(255,255,255,0.5)";
        }
    }

    updateSellBtn() {
        const btn = document.getElementById('toggle-sell-btn');
        if (btn) {
             btn.innerText = `SELL: ${this.sellMode ? 'ON' : 'OFF'}`;
             btn.style.background = this.sellMode ? 'rgba(255,170,0,0.2)' : 'transparent';
        }
    }

    updateDNA() {
        const el = document.getElementById('editor-dna');
        if (el && this.game.creature) {
            el.innerText = `DNA: ${Math.floor(this.game.creature.gameStats.dna)}`;
        }
    }

    addVertebra() {
        if (!this.clone) return;
        if (this.clone.gameStats.dna < 10) return;

        const points = this.clone.points;
        if (points.length >= 30) return;

        this.clone.gameStats.dna -= 10;
        this.updateDNA();

        const last = points[points.length-1];
        const newRadius = Math.max(5, last.baseRadius * 0.95);
        const newX = 0;
        const newY = last.y + 20;

        const newP = Physics.createPoint(newX, newY, newRadius, 1);
        newP.baseRadius = newRadius;
        newP.radius = newRadius;

        points.push(newP);

        const newC = Physics.createConstraint(last, newP, 0.5, 20);
        newC.baseLength = 20;

        this.clone.constraints.push(newC);
        this.fitCamera();
    }

    startDrag(e, type) {
        if (this.sellMode) return;
        this.isDragging = true;
        this.selectedPart = type;
        const pt = this.getEventPos(e);
        this.dragX = pt.x;
        this.dragY = pt.y;
    }

    onDrag(e) {
        if (!this.isDragging) return;
        const pt = this.getEventPos(e);
        this.dragX = pt.x;
        this.dragY = pt.y;
    }

    getClosestBone(pt) {
        const cam = this.game.camera;
        let closest = null;
        let minDist = 200; // Increased radius for better snapping

        this.clone.points.forEach((p, index) => {
            const sp = cam.worldToScreen(p.x, p.y);
            const dx = sp.x - pt.x;
            const dy = sp.y - pt.y;
            const d = Math.sqrt(dx*dx + dy*dy);

            // Screen space distance check
            if (d < minDist) {
                minDist = d;
                closest = { point: p, index: index, sp: sp };
            }
        });
        return closest;
    }

    calcSide(closest, dragX, dragY) {
        // ... (No change needed here, works with snap logic) ...
        // Re-implementing for file completeness
        const bone = closest.point;
        let spineVec = { x: 0, y: 0 };

        if (closest.index < this.clone.points.length - 1) {
            const next = this.clone.points[closest.index + 1];
            spineVec = { x: next.x - bone.x, y: next.y - bone.y };
        } else {
            const prev = this.clone.points[closest.index - 1];
            spineVec = { x: bone.x - prev.x, y: bone.y - prev.y };
        }

        const dropWorld = this.game.camera.screenToWorld(dragX, dragY);
        const dropVec = { x: dropWorld.x - bone.x, y: dropWorld.y - bone.y };
        const dropLen = Math.hypot(dropVec.x, dropVec.y) || 1;
        const normDropX = dropVec.x / dropLen;
        const normDropY = dropVec.y / dropLen;

        const spineLen = Math.hypot(spineVec.x, spineVec.y) || 1;
        const normSpineX = spineVec.x / spineLen;
        const normSpineY = spineVec.y / spineLen;

        const dot = normSpineX * normDropX + normSpineY * normDropY;
        const cross = normSpineX * normDropY - normSpineY * normDropX;

        if (closest.index === 0 && dot < -0.7) return 2; // Nose

        if (cross > 0) return -1;
        return 1;
    }

    endDrag(e) {
        if (!this.isDragging) return;
        this.isDragging = false;

        const closest = this.getClosestBone({x: this.dragX, y: this.dragY});

        if (closest) {
            // MAGNET SNAP: Force drop position to be valid relative to bone
            // Visual feedback already showed snap, now logical placement

            const cost = PARTS_DB[this.selectedPart] ? PARTS_DB[this.selectedPart].cost : 5;
            let totalCost = cost;
            const side = this.calcSide(closest, this.dragX, this.dragY);

            if (this.symmetry && side !== 0) totalCost *= 2;

            if (this.clone.gameStats.dna < totalCost) {
                alert("Not enough DNA!");
                this.selectedPart = null;
                return;
            }

            this.addPart(this.selectedPart, closest.index, side);

            if (this.symmetry && side !== 0) {
                this.addPart(this.selectedPart, closest.index, -side);
            }

            this.clone.gameStats.dna -= totalCost;
            this.updateDNA();
            if (navigator.vibrate) navigator.vibrate(50);
        }

        this.selectedPart = null;
    }

    addPart(type, index, side) {
        if (!this.clone.parts) this.clone.parts = [];
        this.clone.parts.push({
            type: type,
            boneIndex: index,
            side: side
        });
    }

    getEventPos(e) {
        const rect = this.game.canvas.getBoundingClientRect();
        let clientX = 0, clientY = 0;

        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else if (e.changedTouches && e.changedTouches.length > 0) {
             clientX = e.changedTouches[0].clientX;
             clientY = e.changedTouches[0].clientY;
        } else {
             clientX = e.clientX;
             clientY = e.clientY;
        }

        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    onCanvasClick(e) {
        if (!this.active || this.isDragging) return;
        if (e.target !== this.game.canvas) return;

        const pt = this.getEventPos(e);
        const cam = this.game.camera;

        // Selection Fix: Prefer closest center point
        let clickedBone = null;
        let minBoneDist = 999;

        this.clone.points.forEach((p, index) => {
            const sp = cam.worldToScreen(p.x, p.y);
            const dist = Math.hypot(sp.x - pt.x, sp.y - pt.y);
            // Check if inside circle radius on screen
            const radiusScreen = p.radius * cam.zoom;

            if (dist < radiusScreen * 2.0 && dist < minBoneDist) { // Allow slight margin
                minBoneDist = dist;
                clickedBone = { p, index, sp, dist: dist };
            }
        });

        if (clickedBone) {
            const parts = this.clone.parts || [];
            const boneParts = parts.filter(p => p.boneIndex === clickedBone.index);

            if (this.sellMode) {
                 if (boneParts.length > 0) {
                    const toRemove = boneParts[boneParts.length - 1];
                    const cost = PARTS_DB[toRemove.type] ? PARTS_DB[toRemove.type].cost : 5;
                    this.clone.gameStats.dna += Math.floor(cost * 0.5);

                    const idx = parts.indexOf(toRemove);
                    if (idx > -1) parts.splice(idx, 1);

                    this.updateDNA();
                    if (navigator.vibrate) navigator.vibrate(50);
                 }
            } else {
                 this.selectedBone = clickedBone;
                 this.showResizeSlider(clickedBone);
            }
        } else {
            this.selectedBone = null;
            this.hideResizeSlider();
        }
    }

    showResizeSlider(selection) {
        let slider = document.getElementById('resize-slider-container');
        if (!slider) {
            slider = document.createElement('div');
            slider.id = 'resize-slider-container';
            slider.style = `position:absolute; width:150px; padding:10px; display:flex; flex-direction:column; align-items:center; gap:5px; pointer-events:auto; z-index:2001; background:rgba(0,0,0,0.8); border:1px solid #0ff; border-radius:10px;`;
            slider.innerHTML = `
                <div style="font-size:0.8rem; color:#fff;">SCALE</div>
                <input type="range" id="bone-scale" min="0.5" max="1.5" step="0.1" value="1.0" style="width:100%;">
            `;
            document.body.appendChild(slider);

            document.getElementById('bone-scale').addEventListener('input', (e) => {
                if (this.selectedBone) {
                    const scale = parseFloat(e.target.value);
                    if (!this.selectedBone.p.initialBaseRadius) this.selectedBone.p.initialBaseRadius = this.selectedBone.p.baseRadius;

                    const newRadius = this.selectedBone.p.initialBaseRadius * scale;
                    this.selectedBone.p.baseRadius = newRadius;
                    this.selectedBone.p.radius = newRadius;
                    this.selectedBone.p.scaleFactor = scale;
                }
            });
        }

        slider.style.display = 'flex';
        const rect = this.game.canvas.getBoundingClientRect();
        slider.style.left = `${Math.min(window.innerWidth - 160, selection.sp.x + rect.left - 75)}px`;
        slider.style.top = `${selection.sp.y + rect.top - 80}px`;

        if (selection.p.scaleFactor === undefined) {
             const base = selection.p.initialBaseRadius || 20;
             selection.p.scaleFactor = selection.p.baseRadius / base;
        }

        const currentScale = selection.p.scaleFactor || 1.0;
        document.getElementById('bone-scale').value = currentScale;
    }

    hideResizeSlider() {
        const slider = document.getElementById('resize-slider-container');
        if (slider) slider.style.display = 'none';
    }

    render(ctx) {
        if (!this.active) return;

        ctx.save();
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, this.game.width, this.game.height);

        ctx.translate(this.game.width/2, this.game.height/2);
        ctx.scale(this.game.camera.zoom, this.game.camera.zoom);
        ctx.translate(-this.game.camera.x, -this.game.camera.y);

        const DISH_RADIUS = 600;
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, DISH_RADIUS, 0, Math.PI*2);
        ctx.stroke();

        if (this.clone) {
            ctx.globalCompositeOperation = 'source-over';
            this.game.renderer.drawCreature(this.clone, -Math.PI/2);
        }

        ctx.restore();

        if (this.selectedBone) {
            const cam = this.game.camera;
            const p = this.selectedBone.p;
            const sp = cam.worldToScreen(p.x, p.y);

            ctx.save();
            ctx.strokeStyle = '#ff00ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, p.radius * cam.zoom * 1.2 + 5, 0, Math.PI*2);
            ctx.stroke();
            ctx.restore();
        }

        if (this.isDragging && this.selectedPart) {
            const closest = this.getClosestBone({x: this.dragX, y: this.dragY});

            if (closest) {
                // MAGNET SNAP RENDER
                // Snap drag coords to closest bone edge visually
                const dist = Math.hypot(closest.sp.x - this.dragX, closest.sp.y - this.dragY);
                let drawX = this.dragX;
                let drawY = this.dragY;

                // Snap if close
                if (dist < 80) {
                    const side = this.calcSide(closest, this.dragX, this.dragY);
                    // Determine snap pos on screen
                    // This is purely visual, endDrag re-calcs logic
                    // ... complex visual snap code omitted for brevity/simplicity, using ghost indicator instead ...
                }

                ctx.save();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(closest.sp.x, closest.sp.y, closest.point.radius * this.game.camera.zoom * 1.5, 0, Math.PI*2);
                ctx.stroke();
                ctx.restore();

                const bone = closest.point;
                let spineVec = { x: 0, y: 0 };
                if (closest.index < this.clone.points.length - 1) {
                    const next = this.clone.points[closest.index + 1];
                    spineVec = { x: next.x - bone.x, y: next.y - bone.y };
                } else {
                    const prev = this.clone.points[closest.index - 1];
                    spineVec = { x: bone.x - prev.x, y: bone.y - prev.y };
                }

                const side = this.calcSide(closest, this.dragX, this.dragY);
                const spineAngle = Math.atan2(spineVec.y, spineVec.x) + (closest.index===0 ? Math.PI : 0);

                ctx.save();
                ctx.globalAlpha = 0.5;
                const sp = closest.sp;

                ctx.translate(sp.x, sp.y);

                let sideAngle = 0;
                if (side === 1) sideAngle = Math.PI/2;
                else if (side === -1) sideAngle = -Math.PI/2;
                else if (side === 2) sideAngle = Math.PI;

                ctx.rotate(spineAngle + sideAngle);

                const scale = Math.max(0.5, bone.radius / 20);

                ctx.translate(bone.radius * this.game.camera.zoom, 0);

                ctx.fillStyle = '#0ff';
                if(this.selectedPart === 'Spike') ctx.fillStyle = '#f00';
                if(side === 0) ctx.fillStyle = '#ff0';

                ctx.beginPath();
                ctx.arc(0, 0, 10 * scale, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
                ctx.globalAlpha = 1.0;
            }

            ctx.save();
            ctx.fillStyle = 'rgba(0, 255, 255, 0.5)';
            ctx.shadowColor = '#0ff';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(this.dragX, this.dragY, 20, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.font = '12px Orbitron';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.selectedPart[0], this.dragX, this.dragY);
            ctx.restore();
        }
    }
}


// --- js/skills.js ---
class SkillManager {
    constructor(game) {
        this.game = game;
        this.skills = {
            'Dash': { cooldown: 2.0, timer: 0, unlocked: false, icon: '⚡' },
            'Ink': { cooldown: 5.0, timer: 0, unlocked: false, icon: '🦑' },
            'Shock': { cooldown: 8.0, timer: 0, unlocked: false, icon: '🔆' },
            'Shield': { cooldown: 12.0, timer: 0, unlocked: false, icon: '🛡️' }
        };
        this.activeEffects = [];
    }

    unlock(skillName) {
        if(this.skills[skillName]) this.skills[skillName].unlocked = true;
    }

    update(dt) {
        // Cooldowns
        for (let key in this.skills) {
            if (this.skills[key].timer > 0) this.skills[key].timer -= dt;
        }

        // Active Effects
        for (let i = this.activeEffects.length - 1; i >= 0; i--) {
            const fx = this.activeEffects[i];
            fx.life -= dt;
            if (fx.life <= 0) {
                this.activeEffects.splice(i, 1);
            } else {
                if (fx.type === 'shield') {
                    // Draw shield
                    const head = this.game.creature.points[0];
                    this.game.ctx.save();
                    this.game.ctx.translate(head.x, head.y);
                    this.game.ctx.beginPath();
                    this.game.ctx.arc(0, 0, head.radius + 20, 0, Math.PI*2);
                    this.game.ctx.strokeStyle = `rgba(0, 255, 255, ${fx.life / 3})`;
                    this.game.ctx.lineWidth = 5;
                    this.game.ctx.stroke();
                    this.game.ctx.restore();
                }
            }
        }
    }

    activate(skillName) {
        const skill = this.skills[skillName];
        if (!skill || !skill.unlocked || skill.timer > 0) return false;

        skill.timer = skill.cooldown;
        const head = this.game.creature.points[0];

        switch(skillName) {
            case 'Dash':
                // Impulse handled in gameloop, but we can manage cooldown here
                // Actually gameloop handles logic, maybe move it here?
                // For now, gameloop calls this to check cooldown/unlock
                return true;
            case 'Ink':
                this.spawnInk(head.x, head.y);
                return true;
            case 'Shock':
                this.spawnShock(head.x, head.y);
                return true;
            case 'Shield':
                this.activeEffects.push({ type: 'shield', life: 3.0 });
                this.game.creature.stats.defense += 100; // Temp buff
                setTimeout(() => { this.game.creature.stats.defense -= 100; }, 3000);
                return true;
        }
        return false;
    }

    spawnInk(x, y) {
        // Blind enemies
        this.game.spawnParticles(x, y, '#000', 20, 100);
        this.game.enemies.forEach(e => {
            const dist = Math.hypot(e.points[0].x - x, e.points[0].y - y);
            if(dist < 300) {
                e.stunned = 3.0; // Stun mechanic needs to be in Enemy class
            }
        });
    }

    spawnShock(x, y) {
        // AOE Damage
        this.game.distortion.addShockwave(x, y);
        this.game.enemies.forEach(e => {
            const dist = Math.hypot(e.points[0].x - x, e.points[0].y - y);
            if(dist < 200) {
                e.health -= 20;
                // Push back
                const angle = Math.atan2(e.points[0].y - y, e.points[0].x - x);
                e.points[0].x += Math.cos(angle) * 50;
                e.points[0].y += Math.sin(angle) * 50;
            }
        });
    }
}


// --- js/distortion.js ---
class Distortion {
    constructor(canvas, settings) {
        this.canvas = canvas;
        this.settings = settings;
        this.shockwaves = []; // {x, y, radius, life, maxRadius}
    }

    addShockwave(x, y) {
        if (!this.settings.fxEnabled) return;
        this.shockwaves.push({
            x: x, y: y,
            radius: 10,
            maxRadius: 200,
            life: 1.0 // Seconds
        });
    }

    update(dt) {
        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
            const w = this.shockwaves[i];
            w.life -= dt;
            w.radius += dt * 300; // Expand speed
            if (w.life <= 0 || w.radius > w.maxRadius) {
                this.shockwaves.splice(i, 1);
            }
        }
    }

    render(ctx, camera) {
        if (!this.settings.fxEnabled || this.shockwaves.length === 0) return;

        // Simple distortion simulation: Draw a displacement ring
        // Since we can't do true fragment shader distortion easily in 2D canvas without getting pixel data (slow),
        // We will simulate it by drawing a high-contrast ring with specific composite operations or just visual "waves".

        ctx.save();
        ctx.translate(ctx.canvas.width/2, ctx.canvas.height/2);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x, -camera.y);

        this.shockwaves.forEach(w => {
            ctx.beginPath();
            ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
            ctx.lineWidth = 20 * w.life;
            ctx.strokeStyle = `rgba(200, 255, 255, ${w.life * 0.5})`;
            ctx.stroke();

            // Inner clear to simulate "hole" in space
            ctx.beginPath();
            ctx.arc(w.x, w.y, w.radius - 10, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 0, 0, ${w.life * 0.2})`;
            ctx.lineWidth = 5;
            ctx.stroke();
        });

        ctx.restore();
    }
}


// --- js/boss.js ---



class Boss extends Enemy {
    constructor(x, y, type, physics, game) {
        super(x, y, 20, physics, 'boss'); // Init as generic enemy first
        this.game = game;
        this.bossType = type;

        // Wipe the generic body created by super()
        this.points = [];
        this.constraints = [];
        this.parts = [];

        this.setupBoss();

        // Recalculate stats based on new body
        this.stats.calculate(this.parts);
        this.health = 2000;
        this.maxHealth = 2000;

        this.phase = 0;
        this.timer = 0;
        this.scale = 3.0; // Visual scale
    }

    setupBoss() {
        if (this.bossType === 'Leviathan') {
            const segs = 40;
            const startRad = 60;

            // Create Serpentine Body
            let prev = null;
            for (let i = 0; i < segs; i++) {
                const r = startRad * (1 - i / segs);
                // Create points at current position
                const p = Physics.createPoint(this.targetX, this.targetY + i * 40, r, 50);
                p.baseRadius = r;
                this.points.push(p);

                if (prev) {
                    const c = Physics.createConstraint(prev, p, 0.9, 40);
                    c.baseLength = 40;
                    this.constraints.push(c);
                }
                prev = p;
            }

            // Spikes on back
            for(let i=0; i<segs; i+=3) {
                this.parts.push({ type: 'Spike', boneIndex: i, side: 1 });
                this.parts.push({ type: 'Spike', boneIndex: i, side: -1 });
            }
            // Eyes
            this.parts.push({ type: 'Eye', boneIndex: 0, side: 1 });
            this.parts.push({ type: 'Eye', boneIndex: 0, side: -1 });

            this.stats.speed = 800;
            this.stats.turnSpeed = 1.5;
            this.stats.damage = 100;
        }
    }

    update(dt, playerHead) {
        this.timer -= dt;

        const head = this.points[0];

        // Phase Logic
        if (this.health < this.maxHealth * 0.5 && this.phase === 0) {
            this.phase = 1;
            this.color = '#ff4400';
            this.game.distortion.addShockwave(head.x, head.y);
            // Spawn Minions
            for(let i=0; i<5; i++) {
                const minion = new Enemy(head.x + (Math.random()-0.5)*500, head.y + (Math.random()-0.5)*500, 5, this.game.physics, 'hunter');
                this.game.enemies.push(minion);
            }
        }

        // AI State Machine
        if (this.timer <= 0) {
            this.pickMove(playerHead);
        }

        // Execute Move
        if (this.state === 'charge') {
            const angle = Math.atan2(this.targetY - head.y, this.targetX - head.x);
            // Charge speed
            head.vx += Math.cos(angle) * 3000 * dt;
            head.vy += Math.sin(angle) * 3000 * dt;

            if (Math.hypot(this.targetX - head.x, this.targetY - head.y) < 200) {
                this.state = 'cooldown';
                this.timer = 2.0;
            }
        } else if (this.state === 'chase') {
             const targetAngle = Math.atan2(playerHead.y - head.y, playerHead.x - head.x);
             const force = this.stats.speed * dt;
             head.vx += Math.cos(targetAngle) * force;
             head.vy += Math.sin(targetAngle) * force;
        } else if (this.state === 'wander') {
             // Idle movement
             const angle = Math.atan2(this.targetY - head.y, this.targetX - head.x);
             head.vx += Math.cos(angle) * 200 * dt;
             head.vy += Math.sin(angle) * 200 * dt;
        }

        this.physics.update(this.points, this.constraints, dt);
    }

    pickMove(playerHead) {
        const rand = Math.random();
        const dist = Math.hypot(playerHead.x - this.points[0].x, playerHead.y - this.points[0].y);

        if (dist < 1000 && rand < 0.6) {
            // Charge Attack
            this.state = 'charge';
            const head = this.points[0];
            const angle = Math.atan2(playerHead.y - head.y, playerHead.x - head.x);
            const chargeDist = 1500;
            this.targetX = head.x + Math.cos(angle) * chargeDist;
            this.targetY = head.y + Math.sin(angle) * chargeDist;
            this.timer = 3.0;
            // Telegraph
            this.game.distortion.addShockwave(head.x, head.y);
        } else if (rand < 0.9) {
            this.state = 'chase';
            this.timer = 4.0;
        } else {
            this.state = 'wander';
            this.targetX = this.points[0].x + (Math.random()-0.5) * 1000;
            this.targetY = this.points[0].y + (Math.random()-0.5) * 1000;
            this.timer = 2.0;
        }
    }
}


// --- js/sonar.js ---
class Sonar {
    constructor(game) {
        this.game = game;
        this.pulses = []; // {x, y, radius, maxRadius, life}
        this.detectedTargets = []; // {x, y, type, life}

        this.cooldown = 0;
        this.maxCooldown = 5.0;
        this.rangeMultiplier = 3.0; // How far relative to screen
    }

    activate() {
        if (this.cooldown > 0) return false;

        this.cooldown = this.maxCooldown;
        const head = this.game.creature.points[0];

        // Dynamic Range based on Creature Size + Screen Size
        // Should go "Very Far".
        // Let's say 3x the diagonal of the screen in world units?
        // Or fixed large distance?
        // Infinite map, so relative to zoom is better.
        const zoom = this.game.camera.zoom;
        const screenDiag = Math.hypot(this.game.width, this.game.height);
        const worldDiag = screenDiag / zoom;

        const maxRadius = worldDiag * 2.0;

        this.ping(head.x, head.y, maxRadius);

        // Haptic
        if(navigator.vibrate) navigator.vibrate([50, 50, 100]);
        // Audio
        if(this.game.settings.audioEnabled) this.game.audio.playTone(800, 'sine', 1.0);

        return true;
    }

    ping(x, y, maxRadius) {
        this.pulses.push({
            x: x, y: y,
            radius: 10,
            maxRadius: maxRadius,
            life: 3.0, // Duration of expansion
            checked: false // Optimization flag? No, check continuously
        });
    }

    update(dt) {
        if (this.cooldown > 0) this.cooldown -= dt;

        // Update Pulses
        for (let i = this.pulses.length - 1; i >= 0; i--) {
            const p = this.pulses[i];
            p.life -= dt;

            // Expansion Speed: Reach maxRadius in 2 seconds?
            const speed = p.maxRadius / 2.0;
            p.radius += dt * speed;

            if (p.life <= 0 || p.radius > p.maxRadius) {
                this.pulses.splice(i, 1);
            } else {
                this.scan(p);
            }
        }

        // Update Detected Targets (Fade out indicators)
        for (let i = this.detectedTargets.length - 1; i >= 0; i--) {
            const t = this.detectedTargets[i];
            t.life -= dt;
            if (t.life <= 0) this.detectedTargets.splice(i, 1);
        }
    }

    scan(pulse) {
        // Check for new targets crossing the pulse ring
        // Thickness of scan
        const thickness = 100;
        const innerR = pulse.radius - thickness;
        const outerR = pulse.radius;

        // Scan Enemies
        this.game.enemies.forEach(e => {
            if (e.scanned) return; // Custom flag on enemy to avoid double scan per ping?
            // Actually, just check if already in detectedTargets?
            // Better: reset 'scanned' flag on enemies when ping starts? Too complex.
            // Just add to detectedTargets if not already there with high life.

            const head = e.points[0];
            const dist = Math.hypot(head.x - pulse.x, head.y - pulse.y);

            if (dist >= innerR && dist <= outerR) {
                // Found!
                this.addTarget(head.x, head.y, e.bossType ? 'boss' : 'enemy');
            }
        });

        // Scan Food (Meat/Rare)
        this.game.food.forEach(f => {
            if (f.type !== 'meat') return; // Only meat is worth scanning? Or large food?
            const dist = Math.hypot(f.x - pulse.x, f.y - pulse.y);
             if (dist >= innerR && dist <= outerR) {
                this.addTarget(f.x, f.y, 'food');
            }
        });
    }

    addTarget(x, y, type) {
        // Avoid duplicates close to each other
        const existing = this.detectedTargets.find(t => Math.hypot(t.x - x, t.y - y) < 100 && t.type === type);
        if (existing) {
            existing.life = 3.0; // Refresh
            existing.x = x; existing.y = y; // Update pos
            return;
        }

        this.detectedTargets.push({
            x: x, y: y,
            type: type,
            life: 3.0 // Show indicator for 3 seconds
        });
    }

    render(ctx, camera) {
        if (!this.game.settings.fxEnabled && this.pulses.length === 0 && this.detectedTargets.length === 0) return;

        ctx.save();

        // 1. Draw Pulses (World Space)
        ctx.translate(ctx.canvas.width/2, ctx.canvas.height/2);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(-camera.x, -camera.y);

        this.pulses.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(0, 255, 255, ${p.life / 3})`; // Fade out
            ctx.lineWidth = 5 + (p.radius / 500); // Thicker as it grows
            ctx.stroke();
        });

        // 2. Draw Detected Targets (Blips)
        // These are drawn at their world position
        this.detectedTargets.forEach(t => {
            ctx.fillStyle = t.type === 'boss' ? '#f00' : (t.type === 'food' ? '#fa0' : '#f0f');
            ctx.globalAlpha = t.life / 3.0;
            ctx.beginPath();
            ctx.arc(t.x, t.y, 20 / camera.zoom, 0, Math.PI*2); // Constant screen size
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        ctx.restore();

        // 3. Draw Directional Indicators (Screen Space)
        // For targets that are OFF SCREEN.
        this.detectedTargets.forEach(t => {
            const screenPos = camera.worldToScreen(t.x, t.y);
            const pad = 50;
            const w = ctx.canvas.width;
            const h = ctx.canvas.height;

            // Check if offscreen
            if (screenPos.x < 0 || screenPos.x > w || screenPos.y < 0 || screenPos.y > h) {
                // Calculate direction vector from center
                const cx = w/2;
                const cy = h/2;
                const dx = screenPos.x - cx;
                const dy = screenPos.y - cy;
                const angle = Math.atan2(dy, dx);

                // Clamp to screen edge
                // Simple box clamping
                // x = cx + t * dx, y = cy + t * dy
                // find t such that x is 0 or w, or y is 0 or h

                // Better: Just put it on a circle of radius min(w,h)/2 - pad
                const radius = Math.min(w, h)/2 - pad;
                const arrowX = cx + Math.cos(angle) * radius;
                const arrowY = cy + Math.sin(angle) * radius;

                // Draw Arrow
                ctx.save();
                ctx.translate(arrowX, arrowY);
                ctx.rotate(angle);
                ctx.fillStyle = t.type === 'boss' ? '#f00' : (t.type === 'food' ? '#fa0' : '#f0f');
                ctx.globalAlpha = t.life / 3.0;

                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(-10, 10);
                ctx.lineTo(-10, -10);
                ctx.fill();

                // Icon
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(t.type === 'boss' ? '!' : (t.type === 'food' ? 'Meat' : ''), -20, 0);

                ctx.restore();
            }
        });
    }
}


// --- js/ally.js ---



class Ally {
    constructor(data, x, y, physics) {
        this.physics = physics;
        this.active = true;
        this.type = 'ally';

        // Reconstruct from Data (Old Player State)
        this.points = [];
        this.constraints = [];
        this.parts = JSON.parse(JSON.stringify(data.parts));
        this.color = data.color;

        // Stats
        this.stats = new Stats();
        // Ensure gameStats exists and has health
        this.gameStats = {
            health: data.gameStats ? data.gameStats.maxHealth : 100,
            maxHealth: data.gameStats ? data.gameStats.maxHealth : 100,
            mass: data.gameStats ? data.gameStats.mass : 10
        };

        // Rebuild Body at X, Y
        this.rebuildBody(data.points, x, y);

        this.stats.calculate(this.parts);

        // AI State
        this.state = 'follow'; // follow, attack
        this.headAngle = 0;
    }

    rebuildBody(sourcePoints, startX, startY) {
        if (!sourcePoints || sourcePoints.length === 0) return;

        // Calculate offset based on the first point (Head)
        const headSource = sourcePoints[0];
        const offsetX = startX - headSource.x;
        const offsetY = startY - headSource.y;

        sourcePoints.forEach((p, i) => {
            // Create new point with offset
            const newP = Physics.createPoint(p.x + offsetX, p.y + offsetY, p.baseRadius || 20, p.mass || 1);
            newP.baseRadius = p.baseRadius || 20;
            newP.radius = newP.baseRadius; // Init radius

            this.points.push(newP);

            if (i > 0) {
                 const prev = this.points[i-1];
                 const dist = Math.hypot(newP.x - prev.x, newP.y - prev.y);
                 const c = Physics.createConstraint(prev, newP, 0.5, dist);
                 c.baseLength = dist;
                 this.constraints.push(c);
            }
        });
    }

    update(dt, enemies, playerHead) {
        const head = this.points[0];
        if (!head) return;

        // 1. Find Closest Enemy
        let closest = null;
        let minDist = 800; // Aggro range

        for(let e of enemies) {
            if (!e.active) continue;
            const dist = Math.hypot(e.points[0].x - head.x, e.points[0].y - head.y);
            if (dist < minDist) {
                minDist = dist;
                closest = e;
            }
        }

        let targetX = playerHead.x;
        let targetY = playerHead.y;
        let speedMult = 1.0;

        if (closest) {
            this.state = 'attack';
            targetX = closest.points[0].x;
            targetY = closest.points[0].y;
            speedMult = 1.2; // Move faster when attacking
        } else {
            this.state = 'follow';
            // Follow player but maintain distance (flocking-ish)
            const dx = playerHead.x - head.x;
            const dy = playerHead.y - head.y;
            const d = Math.hypot(dx, dy);

            if (d < 300) {
                 // Too close? Move Away
                 targetX = head.x - dx;
                 targetY = head.y - dy;
                 speedMult = 0.8;
            } else if (d > 600) {
                 // Too far? Catch up
                 targetX = playerHead.x;
                 targetY = playerHead.y;
                 speedMult = 1.1;
            } else {
                 // Just right? Orbit/Wander near player
                 targetX = head.x + (Math.random()-0.5)*100;
                 targetY = head.y + (Math.random()-0.5)*100;
                 speedMult = 0.5;
            }
        }

        // Movement
        const dx = targetX - head.x;
        const dy = targetY - head.y;
        const dist = Math.hypot(dx, dy);

        // Update Head Angle
        if (dist > 1) {
             let targetAngle = Math.atan2(dy, dx);
             let diff = targetAngle - this.headAngle;
             while (diff > Math.PI) diff -= Math.PI * 2;
             while (diff < -Math.PI) diff += Math.PI * 2;
             this.headAngle += diff * 5.0 * dt; // Turn speed
        }

        if (dist > 20) {
            const speed = (this.stats.speed || 300) * speedMult;
            const force = speed * dt * dt;

            // Apply impulse to head in direction of headAngle
            head.x += Math.cos(this.headAngle) * force;
            head.y += Math.sin(this.headAngle) * force;
        }

        this.physics.update(this.points, this.constraints, dt);
    }
}

class StateMachine {
    constructor(game) {
        this.game = game;
        this.currentState = null;
        this.states = {};
    }

    add(name, state) {
        this.states[name] = state;
    }

    change(name, params = {}) {
        if (this.currentState && this.currentState.exit) {
            this.currentState.exit();
        }

        this.currentState = this.states[name];

        if (this.currentState && this.currentState.enter) {
            this.currentState.enter(params);
        }
    }

    update(dt) {
        if (this.currentState && this.currentState.update) {
            this.currentState.update(dt);
        }
    }

    render(ctx) {
        if (this.currentState && this.currentState.render) {
            this.currentState.render(ctx);
        }
    }
}

// --- js/states/play_state.js ---




class PlayState {
    constructor(game) {
        this.game = game;
        this.hud = document.getElementById('game-hud');
        this.paused = false;

        // Tier Tracking
        this.currentTier = 1;
        this.maxEntities = 15;

        // Apex Predator Timer
        this.apexTimer = 30.0; // Seconds
        this.activeApex = null; // Track current apex
    }

    enter(params) {
        this.hud.style.display = 'block';
        this.paused = false;
        if (params && params.load) {
            this.game.saveManager.load();
        } else if (params && params.reset) {
            this.game.resetCreature();
        }
        this.calculateTier();
    }

    exit() {
        this.hud.style.display = 'none';
    }

    calculateTier() {
        const mass = this.game.creature.gameStats.mass;
        let newTier = 1;
        if (mass >= 500) newTier = 3;
        else if (mass >= 50) newTier = 2;

        if (newTier !== this.currentTier) {
            this.currentTier = newTier;
        }
    }

    update(dt) {
        if (this.paused) return;
        if (this.game.editor.active) return;

        const game = this.game;
        const creature = game.creature;

        if (creature.gameStats.health <= 0) {
            game.stateMachine.change('gameover');
            return;
        }

        this.calculateTier();

        const baseScale = Math.sqrt(creature.gameStats.mass / 10);
        creature.points.forEach(p => { if(p.baseRadius) p.radius = p.baseRadius * baseScale; });
        creature.constraints.forEach(c => { if(c.baseLength) c.length = c.baseLength * baseScale; });

        const head = creature.points[0];

        const inputVec = game.input.getVector();
        const swimForce = (creature.stats.speed + 1000) * baseScale;
        const turnSpeed = creature.stats.turnSpeed * 2.0;

        if (game.input.active) {
            head.x += inputVec.x * swimForce * dt * dt;
            head.y += inputVec.y * swimForce * dt * dt;
            let targetAngle = Math.atan2(inputVec.y, inputVec.x);
            let diff = targetAngle - game.headAngle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            game.headAngle += diff * turnSpeed * dt;
        }

        if (game.input.checkDoubleTap()) {
            if (game.progression.isUnlocked('Booster')) {
                const dashForce = 5000 * baseScale;
                head.x += Math.cos(game.headAngle) * dashForce * dt;
                head.y += Math.sin(game.headAngle) * dashForce * dt;
                game.spawnParticles(head.x, head.y, '#fff', 20, 300);
                if(game.settings.audioEnabled) game.audio.playDash();
                if(navigator.vibrate) navigator.vibrate(50);
            }
        }

        game.physics.update(creature.points, creature.constraints, dt);
        game.updateBackgroundOnly(dt);
        this.manageEntities(dt, head, baseScale);
        game.boidManager.update(dt, game.enemies);

        if (game.mate) {
            game.mate.update(dt, head, head.radius);
            const dist = Math.hypot(head.x - game.mate.points[0].x, head.y - game.mate.points[0].y);
            if (dist < head.radius + game.mate.points[0].radius + 20) {
                if (game.settings.audioEnabled) game.audio.playTone(600, 'sine', 1.0);
                game.editor.toggle(true);
            }
        }

        for (let i = game.allies.length - 1; i >= 0; i--) {
             const ally = game.allies[i];
             ally.update(dt, game.enemies, head);
             Physics.checkSoftBodyCollision(creature.points, ally.points);
        }

        game.skillManager.update(dt);
        game.distortion.update(dt);
        game.sonar.update(dt);

        for (let i = game.enemies.length - 1; i >= 0; i--) {
            const e = game.enemies[i];
            e.update(dt, head, creature.gameStats.mass);

            Physics.checkSoftBodyCollision(creature.points, e.points);
            const result = this.resolveCombat(creature, e);

            if (result.hit) {
                if (result.playerHit) {
                     const impact = result.impulse || 0;
                     const velocityDmg = Math.min(20, impact * 0.05);
                     const dmg = Math.max(0, e.stats.damage + velocityDmg - creature.stats.defense);
                     creature.gameStats.health -= dmg;
                     creature.lastDamageTime = Date.now();
                     if (dmg > 0 && navigator.vibrate) navigator.vibrate(100);

                     const angle = Math.atan2(head.y - e.points[0].y, head.x - e.points[0].x);
                     head.vx += Math.cos(angle) * 500; head.vy += Math.sin(angle) * 500;
                }
                if (result.enemyHit) {
                     const impact = result.impulse || 0;
                     const velocityDmg = Math.min(20, impact * 0.05);
                     const dmg = Math.max(0, creature.stats.damage + velocityDmg - e.stats.defense);
                     e.health -= dmg;
                     if(e.onHit) e.onHit();

                     const angle = Math.atan2(e.points[0].y - head.y, e.points[0].x - head.x);
                     e.points[0].vx += Math.cos(angle) * 500; e.points[0].vy += Math.sin(angle) * 500;
                }

                game.hitstop = 0.05;
                const mx = (head.x + e.points[0].x) / 2;
                const my = (head.y + e.points[0].y) / 2;
                game.spawnParticles(mx, my, '#ff0044', 5, 200);
                game.camera.x += (Math.random()-0.5) * 10; game.camera.y += (Math.random()-0.5) * 10;
                if(game.settings.audioEnabled) game.audio.playTone(100, 'sawtooth', 0.1, mx, my, game.camera);

                if (e.health <= 0) {
                     game.spawnParticles(mx, my, '#ffaa00', 10, 400);
                     game.spawnMeat(mx, my, 3 + Math.floor(e.scale));
                     game.debris.push(new Debris(e.points, e.constraints, e.color, 4));
                     game.distortion.addShockwave(mx, my);
                     if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
                     const drop = game.progression.checkDrop(null, e.difficulty);
                     if (drop) game.triggerUnlock(drop);

                     if (e.persistent) this.activeApex = null; // Apex died
                     game.enemies.splice(i, 1);
                     continue;
                }
            }
        }

        const hasJaws = creature.parts.some(p => p.type === 'Jaws');
        const hasFilter = creature.parts.some(p => p.type === 'FilterMouth');
        const isCarnivore = hasJaws;
        const isHerbivore = hasFilter || !hasJaws;

        for (let i = game.food.length - 1; i >= 0; i--) {
            const f = game.food[i];
            const dist = Math.hypot(head.x - f.x, head.y - f.y);
            if (dist < head.radius + f.radius) {
                let canEat = false;
                if (f.type === 'meat' && isCarnivore) canEat = true;
                if (f.type !== 'meat' && isHerbivore) canEat = true;

                if (canEat) {
                    game.food.splice(i, 1);
                    const dnaValue = f.dnaValue || 0.2;
                    // Reduced growth speed (Balance)
                    creature.gameStats.dna += dnaValue * 0.5; // Half DNA gain
                    creature.gameStats.mass += 0.2 * dnaValue; // Slower mass gain
                    creature.gameStats.health = Math.min(creature.gameStats.maxHealth, creature.gameStats.health + 5);
                    if(game.settings.audioEnabled) game.audio.playEat(f.x, f.y, game.camera);
                    if(navigator.vibrate) navigator.vibrate(20);
                    game.spawnParticles(f.x, f.y, f.color, 5, 100);
                }
            }
        }

        if (game.food.length < 50) {
            game.spawnFood(10);
        }

        const sonarBtn = document.getElementById('sonar-btn');
        if (sonarBtn) {
            sonarBtn.style.opacity = (creature.gameStats.dna >= 10) ? 1.0 : 0.3;
        }

        game.camera.update(head.x, head.y, head.vx, head.vy, dt, creature.gameStats.mass);
        game.biomeManager.update(dt, creature);

        for (let i = game.debris.length - 1; i >= 0; i--) {
            const d = game.debris[i];
            d.update(dt, game.physics);
            if (!d.active) game.debris.splice(i, 1);
        }
        for (let i = game.particles.length - 1; i >= 0; i--) {
            const p = game.particles[i];
            p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
            if (p.life <= 0) game.particles.splice(i, 1);
        }
    }

    manageEntities(dt, playerHead, playerScale) {
        const game = this.game;

        // --- Apex Predator Logic ---
        this.apexTimer -= dt;
        if (this.apexTimer <= 0 && !this.activeApex) {
            this.apexTimer = 30.0; // Reset
            const angle = Math.random() * Math.PI * 2;
            const dist = 1200 * playerScale;
            const x = playerHead.x + Math.cos(angle) * dist;
            const y = playerHead.y + Math.sin(angle) * dist;

            const apex = new Enemy(x, y, (this.currentTier + 1) * 3, game.physics, 'hunter');
            apex.scale = (this.currentTier + 1) * 1.5;
            apex.color = '#ff0000';
            apex.state = 'chase';
            apex.health = 100 * this.currentTier;
            apex.parts.push({type: 'Jaws', boneIndex: 0, side: 0});
            apex.persistent = true; // Important!
            game.enemies.push(apex);
            this.activeApex = apex;

            // Warning
            game.distortion.addShockwave(x, y);
            const warning = document.createElement('div');
            warning.style = "position:absolute; top:20%; width:100%; text-align:center; color:red; font-family:Orbitron; animation:pulse 1s infinite;";
            warning.innerText = "APEX PREDATOR DETECTED";
            document.body.appendChild(warning);
            setTimeout(() => warning.remove(), 3000);
        }

        const cam = game.camera;
        const viewRadiusW = (game.width / 2) / cam.zoom;
        const viewRadiusH = (game.height / 2) / cam.zoom;
        const viewRadius = Math.max(viewRadiusW, viewRadiusH);

        const spawnMin = viewRadius + 100;
        const spawnMax = spawnMin + 500;
        const despawnDist = spawnMax + 200;

        for (let i = game.enemies.length - 1; i >= 0; i--) {
            const e = game.enemies[i];
            const dist = Math.hypot(playerHead.x - e.points[0].x, playerHead.y - e.points[0].y);

            if (dist > despawnDist && e.bossType !== 'Leviathan' && !e.persistent) {
                game.enemies.splice(i, 1);
                continue;
            }
            if (e.tier < this.currentTier - 1 && !e.persistent) {
                game.enemies.splice(i, 1);
            }
        }

        if (game.enemies.length >= this.maxEntities) return;
        if (Math.random() > 0.05) return;

        const angle = Math.random() * Math.PI * 2;
        const dist = spawnMin + Math.random() * (spawnMax - spawnMin);
        const x = playerHead.x + Math.cos(angle) * dist;
        const y = playerHead.y + Math.sin(angle) * dist;

        let spawnTier = this.currentTier;
        const r = Math.random();
        if (r < 0.6) spawnTier = this.currentTier;
        else if (r < 0.9 && this.currentTier > 1) spawnTier = this.currentTier - 1;
        else if (r < 1.0) spawnTier = this.currentTier + 1;

        if (spawnTier > 3) spawnTier = 3;

        const type = Math.random() > 0.5 ? 'grazer' : 'hunter';

        if (type === 'grazer') {
            const count = 3 + Math.floor(Math.random() * 3);
            if (game.enemies.length + count > this.maxEntities) return;
            const flock = game.boidManager.createFlock(x, y, count, spawnTier, 'grazer');
            flock.forEach(e => {
                e.tier = spawnTier; e.scale = spawnTier;
                e.health *= spawnTier; e.stats.damage *= spawnTier;
            });
            game.enemies.push(...flock);
        } else {
            const e = new Enemy(x, y, spawnTier * 2, game.physics, 'hunter');
            e.tier = spawnTier; e.scale = spawnTier;
            e.health *= spawnTier; e.stats.damage *= spawnTier;
            game.enemies.push(e);
        }
    }

    resolveCombat(player, enemy) {
        let result = { hit: false, playerHit: false, enemyHit: false, impulse: 0 };

        const weaponParts = player.parts.filter(p => p.type === 'Spike' || p.type === 'Jaws' || p.type === 'Poison');
        for (let part of weaponParts) {
            const bone = player.points[part.boneIndex];
            if (!bone) continue;
            const range = bone.radius + 20;

            for (let ePoint of enemy.points) {
                const dist = Math.hypot(bone.x - ePoint.x, bone.y - ePoint.y);
                if (dist < range + ePoint.radius) {
                    result.hit = true;
                    result.enemyHit = true;
                    // Calculate Impulse
                    const relVx = (bone.vx || 0) - (ePoint.vx || 0);
                    const relVy = (bone.vy || 0) - (ePoint.vy || 0);
                    result.impulse = Math.hypot(relVx, relVy);
                    break;
                }
            }
            if (result.enemyHit) break;
        }

        const enemyWeapons = enemy.parts.filter(p => p.type === 'Spike' || p.type === 'Jaws');
        for (let part of enemyWeapons) {
            const bone = enemy.points[part.boneIndex];
            if (!bone) continue;
            const range = bone.radius + 20;

            for (let pPoint of player.points) {
                const dist = Math.hypot(bone.x - pPoint.x, bone.y - pPoint.y);
                if (dist < range + pPoint.radius) {
                    result.hit = true;
                    result.playerHit = true;
                    const relVx = (bone.vx || 0) - (pPoint.vx || 0);
                    const relVy = (bone.vy || 0) - (pPoint.vy || 0);
                    result.impulse = Math.hypot(relVx, relVy);
                    break;
                }
            }
            if (result.playerHit) break;
        }

        return result;
    }

    render(ctx) {
        if (this.game.editor.active) {
            this.game.editor.render(ctx);
            return;
        }

        const game = this.game;
        if (game.settings.fxEnabled) game.lighting.update(game.camera, { player: game.creature, enemies: game.enemies, food: game.food });

        const head = game.creature.points[0];
        const biome = game.biomeManager.getCurrentBiome(head ? head.x : 0, head ? head.y : 0);
        const bgGrad = ctx.createLinearGradient(0, 0, 0, game.height);
        bgGrad.addColorStop(0, '#000000');
        bgGrad.addColorStop(1, biome.color);
        ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, game.width, game.height);

        this.renderParallax(ctx);

        game.camera.apply(ctx);
        if(game.settings.fxEnabled) ctx.globalCompositeOperation = 'lighter';
        game.food.forEach(f => {
            ctx.fillStyle = f.color;
            ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalCompositeOperation = 'source-over';
        game.debris.forEach(d => d.render(ctx));
        game.particles.forEach(p => {
            ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        game.enemies.forEach(e => {
            e.render(ctx);
        });

        if (game.mate) game.renderer.drawCreature(game.mate, 0);
        game.renderer.drawCreature(game.creature, game.headAngle);
        game.camera.restore(ctx);

        game.lighting.render(ctx);
        game.distortion.render(ctx, game.camera);
        game.sonar.render(ctx, game.camera);

        this.drawHUD(ctx);
        this.drawApexWarning(ctx);
    }

    drawApexWarning(ctx) {
        if (!this.activeApex) return;

        const game = this.game;
        const cam = game.camera;
        const target = this.activeApex.points[0];
        const screenPos = cam.worldToScreen(target.x, target.y);
        const w = game.width;
        const h = game.height;

        // Check if offscreen
        if (screenPos.x < 0 || screenPos.x > w || screenPos.y < 0 || screenPos.y > h) {
            const cx = w/2;
            const cy = h/2;
            const angle = Math.atan2(screenPos.y - cy, screenPos.x - cx);
            const r = Math.min(w, h)/2 - 40;

            const px = cx + Math.cos(angle) * r;
            const py = cy + Math.sin(angle) * r;

            ctx.save();
            ctx.translate(px, py);
            ctx.rotate(angle);
            ctx.fillStyle = '#f00';
            ctx.beginPath();
            ctx.moveTo(10, 0); ctx.lineTo(-10, 10); ctx.lineTo(-10, -10);
            ctx.fill();
            ctx.restore();

            // Text Pulse
            const pulse = (Date.now() % 1000) / 1000;
            if (pulse < 0.5) {
                ctx.fillStyle = '#f00';
                ctx.font = '20px Orbitron';
                ctx.textAlign = 'center';
                ctx.fillText("DANGER", px, py + 30);
            }
        }
    }

    renderParallax(ctx) {
        const game = this.game;
        const cam = game.camera;
        const cx = game.width / 2;
        const cy = game.height / 2;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1.0, 1.0);
        ctx.translate(-cam.x * 0.05, -cam.y * 0.05);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        game.bgDeep.forEach(p => {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        });
        ctx.restore();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(cam.zoom * 0.5, cam.zoom * 0.5);
        ctx.translate(-cam.x * 0.2, -cam.y * 0.2);
        ctx.fillStyle = 'rgba(100, 255, 255, 0.1)';
        game.bgMid.forEach(p => {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2, 0, Math.PI*2); ctx.fill();
        });
        ctx.restore();

        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(cam.zoom * 1.5, cam.zoom * 1.5);
        ctx.translate(-cam.x * 1.5, -cam.y * 1.5);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        game.bgFore.forEach(p => {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI*2); ctx.fill();
        });
        ctx.restore();
    }

    drawHUD(ctx) {
        const game = this.game;
        const dna = Math.floor(game.creature.gameStats.dna);
        const w = game.width;

        ctx.save();
        ctx.fillStyle = 'rgba(0, 10, 30, 0.8)';
        ctx.fillRect(0, 0, w, 60);
        ctx.beginPath();
        ctx.moveTo(0, 60); ctx.lineTo(w, 60);
        ctx.strokeStyle = '#00aaff';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = '#00aaff';
        ctx.font = '20px Orbitron';
        ctx.textAlign = 'left';
        ctx.fillText(`DNA-SEQUENCE: ${dna}`, 20, 38);
        ctx.textAlign = 'right';
        ctx.fillText(`TIER: ${this.currentTier}`, w - 20, 38);
        ctx.restore();
    }
}

class GameOverState {
    constructor(game) {
        this.game = game;
        this.ui = document.getElementById('game-over');
    }

        this.ui.style.display = 'flex';
        document.getElementById('game-hud').style.display = 'none';
    }

    exit() {
        this.ui.style.display = 'none';
    }

    update(dt) {
        // Slow motion update or freeze?
        // Let's keep background moving but not physics
        this.game.updateBackgroundOnly(dt);
    }

    render(ctx) {
        // Draw the last frame of the game basically
        // But maybe red tinted
        // For simplicity, just render the PlayState's view but frozen?
        // Or just background.

        // Let's render background + dead creature debris
        const game = this.game;

        // Background

// --- js/states/intro.js ---
class IntroState {
    constructor(game) {
        this.game = game;
        this.time = 0;
        this.phase = 'space'; // space, entry, impact, submerged, transition
        this.stars = [];
        this.bubbles = [];
        this.planetScale = 0;
        this.impactFlash = 0;

        // Init Stars
        for(let i=0; i<100; i++) {
            this.stars.push({
                x: (Math.random()-0.5) * window.innerWidth,
                y: (Math.random()-0.5) * window.innerHeight,
                z: Math.random() * 2 // depth
            });
        }
    }

    enter() {
        this.time = 0;
        this.phase = 'space';
        this.game.audio.startAmbient(); // Ensure audio is ready
        document.getElementById('game-hud').style.display = 'none';

        // Hide Main Menu if visible
        document.getElementById('main-menu').style.display = 'none';
    }

    exit() {
        // Cleanup if needed
    }

    update(dt) {
        this.time += dt;

        if (this.phase === 'space') {
            // Move stars
            this.stars.forEach(s => {
                s.z -= dt * 0.5;
                if (s.z <= 0) s.z += 2;
            });

            // Planet grows
            if (this.time > 2.0) {
                this.planetScale += dt * 0.5;
            }

            if (this.planetScale > 5.0) {
                this.phase = 'entry';
                this.time = 0; // Reset local time for next phase
            }
        }
        else if (this.phase === 'entry') {
            // Shake and burn
            this.planetScale += dt * 10.0; // Fast zoom into surface

            if (this.time > 1.5) {
                this.phase = 'impact';
                this.impactFlash = 1.0;
                this.time = 0;
                if(navigator.vibrate) navigator.vibrate(200);
            }
        }
        else if (this.phase === 'impact') {
            this.impactFlash -= dt * 0.5;
            if (this.time > 2.0) {
                this.phase = 'submerged';
                this.time = 0;
                // Initialize bubbles
                for(let i=0; i<50; i++) {
                    this.bubbles.push({
                        x: Math.random() * this.game.width,
                        y: this.game.height + Math.random() * 500,
                        r: 2 + Math.random() * 5,
                        v: 50 + Math.random() * 100
                    });
                }
            }
        }
        else if (this.phase === 'submerged') {
            // Bubbles rise
            this.bubbles.forEach(b => {
                b.y -= b.v * dt;
                b.x += Math.sin(b.y * 0.05) * 1;
            });

            // Camera pans down or we fade in the creature
            if (this.time > 4.0) {
                this.game.stateMachine.change('genesis');
            }
        }
    }

    render(ctx) {
        const w = this.game.width;
        const h = this.game.height;
        const cx = w/2;
        const cy = h/2;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        if (this.phase === 'space' || this.phase === 'entry') {
            // Draw Stars
            ctx.fillStyle = '#fff';
            this.stars.forEach(s => {
                const k = 128.0 / s.z;
                const px = s.x * k + cx;
                const py = s.y * k + cy;

                if (px >= 0 && px <= w && py >= 0 && py <= h) {
                    const size = (1 - s.z / 2) * 3;
                    ctx.beginPath();
                    ctx.arc(px, py, Math.max(0.1, size), 0, Math.PI*2);
                    ctx.fill();
                }
            });

            // Draw Planet
            if (this.planetScale > 0) {
                const radius = 50 * Math.pow(this.planetScale, 2);
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                grad.addColorStop(0, '#000022');
                grad.addColorStop(0.5, '#0044aa');
                grad.addColorStop(1, '#0088ff');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI*2);
                ctx.fill();
            }
        }

        if (this.phase === 'entry') {
             // Red heat burn overlay
             ctx.fillStyle = `rgba(255, 100, 0, ${Math.min(0.5, this.time * 0.5)})`;
             ctx.fillRect(0, 0, w, h);

             // Shake
             ctx.save();
             ctx.translate((Math.random()-0.5)*20, (Math.random()-0.5)*20);
             ctx.restore();
        }

        if (this.phase === 'impact') {
            ctx.fillStyle = `rgba(255, 255, 255, ${this.impactFlash})`;
            ctx.fillRect(0, 0, w, h);
        }

        if (this.phase === 'submerged') {
            // Deep Blue
            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, '#000011');
            grad.addColorStop(1, '#001133');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Bubbles
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            this.bubbles.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
                ctx.fill();
            });

            // Text: "PHASE 1: THE AWAKENING"
            if (this.time > 1.0) {
                ctx.fillStyle = `rgba(0, 255, 255, ${Math.min(1, (this.time - 1.0))})`;
                ctx.font = '30px Orbitron';
                ctx.textAlign = 'center';
                ctx.fillText("PHASE 1: THE PRIMORDIAL SOUP", cx, cy);
            }
        }
    }
}

class GameLoop {
    constructor() {
        this.running = false;
        this.lastTime = 0;
        this.fps = 60;
        this.step = 1 / this.fps;

        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.width = 0;
        this.height = 0;

        this.input = new Input();
        this.physics = new Physics();
        this.camera = new Camera(window.innerWidth, window.innerHeight);
        this.settings = new Settings();
        this.audio = new AudioSystem();
        this.lighting = new Lighting(this.canvas, this.settings);
        this.renderer = new Renderer(this.ctx, this.camera, this.settings);

        // --- JELLY CREATURE (Soft Body) ---
        this.creature = {
            points: [],
            constraints: [],
            parts: [],
            stats: new Stats(),
            gameStats: { dna: 0, mass: 10, health: 100, maxHealth: 100 },
            color: '#00ffff'
        };

        this.saveManager = new SaveManager(this);
        this.progression = new Progression(this.saveManager);
        this.legacyManager = new LegacyManager();
        this.assets = new AssetGenerator();
        this.boidManager = new BoidManager(this.physics);
        this.biomeManager = new BiomeManager(this);
        this.headAngle = 0;
        this.editor = new Editor(this);
        this.skillManager = new SkillManager(this);
        this.distortion = new Distortion(this.canvas, this.settings);
        this.sonar = new Sonar(this);

        // Ecosystem
        this.bgAbyssal = [];
        this.bgRays = { angle: 0 };
        this.bgDeep = [];
        this.bgMid = [];
        this.bgFore = [];

        this.enemies = [];
        this.allies = [];
        this.food = [];
        this.debris = [];
        this.particles = [];
        this.hitstop = 0;
        this.bossActive = false;
        this.mate = null;

        // UI Layers
        this.createUI();

        // State Machine
        this.stateMachine = new StateMachine(this);
        this.stateMachine.add('menu', new MenuState(this));
        this.stateMachine.add('playing', new PlayState(this));
        this.stateMachine.add('gameover', new GameOverState(this));

        const menu = document.createElement('div');

        menu.style = 'display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:100; flex-direction:column; justify-content:center; align-items:center;';

    setupEventListeners() {
        document.getElementById('play-btn').onclick = () => this.startIntro();
        document.getElementById('settings-btn').onclick = () => {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('settings-menu').style.display = 'flex';
            this.updateSettingsButtons();
        };
        document.getElementById('legacy-btn').onclick = () => this.openLegacyMenu();
        document.getElementById('back-btn').onclick = () => {
            document.getElementById('settings-menu').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        };
        document.getElementById('reset-save-btn').onclick = () => {
            if(confirm('Reset all progress?')) {
                this.saveManager.reset();
                location.reload();
            }
        };
        document.getElementById('toggle-fx-btn').onclick = () => this.toggleFX();
        document.getElementById('toggle-audio-btn').onclick = () => this.toggleAudio();
        document.getElementById('export-btn').onclick = () => {
            const code = Social.exportCreature(this.creature);
            Social.copyToClipboard(code);
        };
        document.getElementById('import-btn').onclick = () => {
            const code = prompt("Paste Rival DNA:");
            if(code) this.spawnRival(code);
        };
        document.getElementById('pause-trigger-btn').onclick = () => this.pauseGame();
        document.getElementById('respawn-btn').onclick = () => this.respawn();
        document.getElementById('evolve-btn').onclick = () => {
            this.editor.toggle(true);
            document.getElementById('evolve-btn').style.display = 'none';
        };
        document.getElementById('resume-btn').onclick = () => this.resumeGame();
        document.getElementById('quit-btn').onclick = () => {
            document.getElementById('pause-menu').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
            document.getElementById('game-hud').style.display = 'none';
            this.stateMachine.change('menu');
        };
        document.getElementById('pause-fx-btn').onclick = () => this.toggleFX();
        document.getElementById('pause-audio-btn').onclick = () => this.toggleAudio();
        document.getElementById('sonar-btn').onclick = () => {
             if(this.sonar.activate()) {
                 const btn = document.getElementById('sonar-btn');
                 btn.style.opacity = 0.5;
                 setTimeout(() => btn.style.opacity = 1.0, 5000);
             }
        };

        // Unlock Card Click to continue
        document.getElementById('unlock-overlay').onclick = () => {
            document.getElementById('unlock-overlay').style.display = 'none';
            this.resumeGame();
        };
    }

    triggerUnlock(partKey) {
        if (this.progression.unlock(partKey)) {
            this.pauseGame(true); // True = Unlock Mode
            // Haptic Pattern
            if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);

            const overlay = document.getElementById('unlock-overlay');
            const part = PARTS_DB[partKey];
            overlay.innerHTML = `
                <div class="unlock-card">
                    <h2 style="color:#0ff; margin-bottom:10px;">EVOLUTION UNLOCKED</h2>
                    <div class="unlock-icon">${partKey[0]}</div>
                    <h1 style="font-size:2rem; margin:10px 0;">${part.name}</h1>
                    <p style="color:#aaa; font-size:0.9rem;">${part.desc}</p>
                    <div style="margin-top:20px; color:#0f0; font-weight:bold;">${part.stat}</div>
                    <div style="margin-top:20px; font-size:0.8rem; animation:pulse 1s infinite;">TAP TO CONTINUE</div>
                </div>
            `;
            overlay.style.display = 'flex';
            if (this.settings.audioEnabled) this.audio.playTone(400, 'sine', 0.5); // Victory sound
        }
    }

    toggleFX() {
        if (!this.settings.fxEnabled) {
             if(confirm("WARNING: High Performance Required.
Enable advanced visual effects? (Battery Drain / Lag possible)")) {
                 this.settings.toggleFX();
             }
        } else {
             this.settings.toggleFX();
        }
        this.updateSettingsButtons();
    }

    toggleAudio() {
        const state = this.settings.toggleAudio();
        this.updateSettingsButtons();
        if(state) this.audio.resume();
        else this.audio.ctx.suspend();
    }

    updateSettingsButtons() {
        const fxText = `FX: ${this.settings.fxEnabled ? 'ON' : 'OFF'}`;
        const audioText = `AUDIO: ${this.settings.audioEnabled ? 'ON' : 'OFF'}`;

        document.getElementById('toggle-fx-btn').innerText = fxText;
        document.getElementById('toggle-audio-btn').innerText = audioText;
        document.getElementById('pause-fx-btn').innerText = fxText;
        document.getElementById('pause-audio-btn').innerText = audioText;
    }

        this.renderLegacyUI();

        const dna = this.legacyManager.legacyDNA;

        let html = `
            <h1 style="color:#f0f; font-family:Orbitron;">ANCESTRAL MEMORY</h1>

    buyLegacy(key) {

            if(navigator.vibrate) navigator.vibrate([50, 50]);

        } else {
