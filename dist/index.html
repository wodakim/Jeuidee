<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jelly Evolution (Prototype)</title>
    <style>
/* NEON ABYSS THEME */
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

:root {
    --primary: #00ffff;
    --secondary: #ff00ff;
    --danger: #ff4444;
    --dark: #000510;
    --glass: rgba(0, 10, 20, 0.6);
    --border: 1px solid rgba(0, 255, 255, 0.2);
}

body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--dark);
    font-family: 'Rajdhani', sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
}

#game-container {
    position: relative;
    width: 100%;
    height: 100%;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

/* UI UTILS */
.glass-panel {
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: var(--border);
    border-radius: 16px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
}

.btn-neon {
    background: linear-gradient(135deg, rgba(0,255,255,0.1), rgba(0,255,255,0.0));
    border: 1px solid var(--primary);
    color: var(--primary);
    padding: 12px 30px;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2rem;
    font-weight: bold;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 30px;
    transition: all 0.2s ease;
    text-shadow: 0 0 5px var(--primary);
    box-shadow: 0 0 10px rgba(0,255,255,0.2);
}

.btn-neon:active {
    transform: scale(0.95);
    background: var(--primary);
    color: #000;
    box-shadow: 0 0 20px var(--primary);
}

.btn-danger {
    border-color: var(--danger);
    color: var(--danger);
    text-shadow: 0 0 5px var(--danger);
    box-shadow: 0 0 10px rgba(255, 68, 68, 0.2);
}

.btn-danger:active {
    background: var(--danger);
    color: #fff;
    box-shadow: 0 0 20px var(--danger);
}

/* MENUS */
#main-menu, #game-over {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    background: radial-gradient(circle, rgba(0,20,40,0.8) 0%, rgba(0,5,10,0.95) 100%);
    opacity: 0;
    animation: fadeIn 0.5s forwards;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 4rem;
    margin: 0;
    background: linear-gradient(to bottom, #fff, var(--primary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px var(--primary));
    text-align: center;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

@keyframes pulse {
    0% { transform: scale(1); box-shadow: 0 0 10px var(--secondary); }
    50% { transform: scale(1.05); box-shadow: 0 0 20px var(--secondary); }
    100% { transform: scale(1); box-shadow: 0 0 10px var(--secondary); }
}

/* EDITOR OVERLAY */
#editor-overlay {
    background: rgba(0, 0, 0, 0.4);
    animation: fadeIn 0.3s forwards;
    z-index: 2000; /* Ensure above Ad Space */
}

.editor-sidebar {
    position: absolute;
    top: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding: 15px;
    pointer-events: auto; /* Catch clicks */
}

.editor-sidebar.right { right: 20px; }
.editor-sidebar.left { left: 20px; }

.part-item {
    width: 80px;
    padding: 15px;
    text-align: center;
    border-radius: 12px;
    cursor: grab;
    transition: transform 0.2s;
    font-weight: bold;
    font-size: 0.9rem;
    background: rgba(0, 20, 40, 0.8);
    border: 1px solid rgba(255,255,255,0.1);
    pointer-events: auto; /* Explicitly auto */
}

.part-item:active { cursor: grabbing; transform: scale(0.9); }

.part-item[data-type="Fin"] { color: var(--primary); border-color: var(--primary); }
.part-item[data-type="Spike"] { color: var(--danger); border-color: var(--danger); }
.part-item[data-type="Eye"] { color: #fff; border-color: #fff; }

.editor-controls {
    position: absolute;
    bottom: 80px; /* Raised above Ad Space (50px) */
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 20px;
    pointer-events: none; /* Let clicks pass through gaps */
}

.editor-controls button {
    pointer-events: auto;
}

/* HUD */
#evolve-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    animation: pulse 2s infinite;
    z-index: 90;
    background: linear-gradient(45deg, var(--secondary), #aa00ff);
    border: none;
    color: white;
    padding: 10px 25px;
    border-radius: 20px;
    font-family: 'Orbitron';
    font-weight: bold;
    box-shadow: 0 0 15px var(--secondary);
    cursor: pointer;
}

/* AD SPACE */
#ad-space {
    border-top: 1px solid var(--primary);
    box-shadow: 0 -5px 20px rgba(0,255,255,0.1);
}

/* UNLOCK CARD OVERLAY */
#unlock-overlay {
    perspective: 1000px;
    background: rgba(0,0,0,0.9);
}

.unlock-card {
    width: 250px;
    height: 350px;
    background: linear-gradient(135deg, #001, #003);
    border: 2px solid var(--primary);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 50px var(--primary);
    transform-style: preserve-3d;
    animation: spinCard 2s ease-out forwards;
    padding: 20px;
    text-align: center;
}

.unlock-icon {
    width: 100px;
    height: 100px;
    background: rgba(0,255,255,0.1);
    border-radius: 50%;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: var(--primary);
    box-shadow: inset 0 0 20px var(--primary);
}

@keyframes spinCard {
    0% { transform: rotateY(720deg) scale(0); opacity: 0; }
    80% { transform: rotateY(0deg) scale(1.1); opacity: 1; }
    100% { transform: rotateY(0deg) scale(1); }
}

</style>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    <script>

// --- js/audio.js ---
class AudioSystem {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.5;
        this.masterGain.connect(this.ctx.destination);

        // Reverb / Echo
        this.delay = this.ctx.createDelay();
        this.delay.delayTime.value = 0.1; // 100ms echo
        this.delayFeedback = this.ctx.createGain();
        this.delayFeedback.gain.value = 0.4;
        this.delayFilter = this.ctx.createBiquadFilter();
        this.delayFilter.type = 'lowpass';
        this.delayFilter.frequency.value = 1000; // Dampen echo

        // Routing: Input -> Delay -> Feedback -> Input
        this.delay.connect(this.delayFeedback);
        this.delayFeedback.connect(this.delayFilter);
        this.delayFilter.connect(this.delay);

        // Connect Delay to Master (Wet Mix)
        this.delay.connect(this.masterGain);

        // Ambience
        this.droneOsc = null;
        this.startDrone();
    }

    resume() {
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    startAmbient() {
        if (!this.droneOsc) {
            this.startDrone();
        }
    }

    startDrone() {
        // Deep Sea Drone (Low sine + modulation)
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 15;

        const mod = this.ctx.createOscillator();
        mod.type = 'sine';
        mod.frequency.value = 0.05; // Slow throb

        const modGain = this.ctx.createGain();
        modGain.gain.value = 20;

        mod.connect(modGain);
        modGain.connect(osc.frequency);

        const gain = this.ctx.createGain();
        gain.gain.value = 0.1; // Quiet

        osc.connect(gain);
        gain.connect(this.masterGain); // Direct to master, no reverb for clean bass

        osc.start();
        mod.start();

        this.droneOsc = { osc, mod, gain };
    }

    playTone(freq, type, duration, x = 0, y = 0, camera = null) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const panner = this.ctx.createStereoPanner();

        // Spatial Audio Logic
        if (camera) {
            // Screen width is roughly camera.viewportWidth / camera.zoom
            // Let's approximate. Center is camera.x, camera.y
            const relX = (x - camera.x);
            // Normalize roughly. View width varies.
            // Let's assume view width ~1000 world units at zoom 1
            const pan = Math.max(-1, Math.min(1, relX / (500 / camera.zoom)));
            panner.pan.value = pan;
        }

        osc.type = type;
        osc.frequency.value = freq;

        osc.connect(gain);
        gain.connect(panner);
        panner.connect(this.masterGain);
        panner.connect(this.delay); // Send to reverb

        const now = this.ctx.currentTime;
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

        osc.start(now);
        osc.stop(now + duration);
    }

    playEat(x, y, camera) {
        this.playTone(300 + Math.random() * 200, 'triangle', 0.1, x, y, camera);
        this.playTone(500 + Math.random() * 200, 'sine', 0.15, x, y, camera);
    }

    playDash() {
        // White noise burst for dash?
        // Simple sweep
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    }
}


// --- js/physics.js ---
class Physics {
    constructor() {
        this.gravity = 0;
        this.friction = 0.94; // Decreased friction from 0.92 for more "glide"
        this.elasticity = 0.5;
    }

    static createPoint(x, y, radius = 10, mass = 1) {
        return {
            x: x, y: y,
            oldX: x, oldY: y,
            vx: 0, vy: 0,
            radius: radius,
            mass: mass,
            pinned: false
        };
    }

    static createConstraint(p1, p2, stiffness = 0.1, length = null) {
        const dx = p1.x - p2.x;
        const dy = p1.y - p2.y;
        return {
            p1: p1,
            p2: p2,
            length: length !== null ? length : Math.hypot(dx, dy),
            stiffness: stiffness
        };
    }

    update(points, constraints, dt) {
        for (let p of points) {
            if (p.pinned) continue;
            // Velocity Verlet
            const vx = (p.x - p.oldX) * this.friction;
            const vy = (p.y - p.oldY) * this.friction;
            p.oldX = p.x;
            p.oldY = p.y;
            p.x += vx;
            p.y += vy;
            p.vx = vx;
            p.vy = vy;
        }

        const iterations = 3; // Optimization: Reduced from 5
        for (let i = 0; i < iterations; i++) {
            for (let c of constraints) {
                const dx = c.p2.x - c.p1.x;
                const dy = c.p2.y - c.p1.y;
                const dist = Math.hypot(dx, dy);
                if (dist === 0) continue;
                const diff = (c.length - dist) / dist;
                const offset = diff * c.stiffness * 0.5;
                const offsetX = dx * offset;
                const offsetY = dy * offset;
                if (!c.p1.pinned) {
                    c.p1.x -= offsetX;
                    c.p1.y -= offsetY;
                }
                if (!c.p2.pinned) {
                    c.p2.x += offsetX;
                    c.p2.y += offsetY;
                }
            }
        }
    }

    static checkSoftBodyCollision(body1Points, body2Points) {
        let collision = false;

        for (let p1 of body1Points) {
            for (let p2 of body2Points) {
                const dx = p1.x - p2.x;
                const dy = p1.y - p2.y;
                const dist = Math.hypot(dx, dy);
                const minDist = p1.radius + p2.radius;

                if (dist < minDist) {
                    collision = true;
                    const overlap = minDist - dist;
                    const nx = dx / dist;
                    const ny = dy / dist;

                    const force = overlap * 0.5;

                    p1.x += nx * force;
                    p1.y += ny * force;
                    p2.x -= nx * force;
                    p2.y -= ny * force;

                    // Bounce
                    const bounce = 0.8; // Higher bounce
                    p1.oldX -= nx * bounce;
                    p1.oldY -= ny * bounce;
                    p2.oldX += nx * bounce;
                    p2.oldY += ny * bounce;
                }
            }
        }
        return collision;
    }
}


// --- js/stats.js ---
class Stats {
    constructor() {
        this.baseSpeed = 1500;
        this.baseDamage = 5;
        this.baseDefense = 0;
        this.baseTurnSpeed = 5;

        // Calculated
        this.speed = this.baseSpeed;
        this.damage = this.baseDamage;
        this.defense = this.baseDefense;
        this.turnSpeed = this.baseTurnSpeed;
    }

    calculate(parts, legacyBuffs = null) {
        let speedMod = 0;
        let damageMod = 0;
        let defenseMod = 0;
        let turnMod = 0;

        parts.forEach(part => {
            switch(part.type) {
                case 'Fin':
                    speedMod += 200;
                    turnMod += 1;
                    break;
                case 'Spike':
                    damageMod += 10;
                    defenseMod += 2;
                    break;
                case 'Eye':
                    // Enhanced vision (could affect zoom or food detection range)
                    break;
                case 'Poison':
                    damageMod += 5; // Passive DoT
                    defenseMod += 1; // Deterrent
                    break;
                case 'Tentacle':
                    turnMod += 2; // Better maneuvering
                    damageMod += 2; // Slight damage
                    break;
                case 'Shield':
                    defenseMod += 15;
                    speedMod -= 50; // Heavy
                    break;
                case 'Booster':
                    speedMod += 400;
                    turnMod -= 0.5; // Harder to steer
                    break;
            }
        });

        this.speed = Math.max(100, this.baseSpeed + speedMod);
        this.damage = this.baseDamage + damageMod;
        this.defense = this.baseDefense + defenseMod;
        this.turnSpeed = Math.max(1, this.baseTurnSpeed + turnMod);

        // Apply Legacy Buffs
        if (legacyBuffs) {
            this.speed *= legacyBuffs.speedMult;
            // Add other stats if needed
        }
    }
}


// --- js/camera.js ---
class Camera {
    constructor(width, height) {
        this.x = 0;
        this.y = 0;
        this.zoom = 1;
        this.targetZoom = 1;

        this.viewportWidth = width;
        this.viewportHeight = height;

        // Settings
        this.followStrength = 0.05; // Lerp factor (lower = smoother/lazier)
        this.lookAhead = 100; // How far to look ahead based on velocity
        this.baseZoom = 0.7; // Default "Far" zoom for gameplay (was 1.0)
    }

    resize(w, h) {
        this.viewportWidth = w;
        this.viewportHeight = h;
    }

    update(targetX, targetY, targetVx, targetVy, dt, playerMass = 10) {
        // 1. Calculate Target Position (Center on player + Lookahead)
        const idealX = targetX + targetVx * 0.5; // Lookahead
        const idealY = targetY + targetVy * 0.5;

        // 2. Smoothly interpolate current camera position towards ideal
        this.x += (idealX - this.x) * this.followStrength;
        this.y += (idealY - this.y) * this.followStrength;

        // 3. Zoom Logic (Dynamic based on Mass and Speed)
        // Base scale inverse to mass
        // Mass 10 -> Scale 1.0
        // Mass 100 -> Scale 3.16 -> Zoom ~0.3

        const playerScale = Math.sqrt(playerMass / 10);

        // Target Zoom is inverse of player scale, but clamped
        // Zoom out as player gets bigger to keep view consistent relative to player size
        const massZoom = this.baseZoom / Math.max(1, playerScale * 0.8);

        // Also zoom out slightly with speed
        const speed = Math.hypot(targetVx, targetVy);
        const speedFactor = Math.min(speed / 1000, 1);
        const speedZoomMod = 1 - (speedFactor * 0.2);

        this.targetZoom = massZoom * speedZoomMod;

        // Clamp min zoom to avoid seeing edge of world if we had one (but world is infinite parallax)
        this.targetZoom = Math.max(0.1, this.targetZoom);

        this.zoom += (this.targetZoom - this.zoom) * 0.02; // Slow zoom
    }

    // Convert World Point to Screen Point
    worldToScreen(wx, wy) {
        return {
            x: (wx - this.x) * this.zoom + this.viewportWidth / 2,
            y: (wy - this.y) * this.zoom + this.viewportHeight / 2
        };
    }

    // Convert Screen Point to World Point
    screenToWorld(sx, sy) {
        return {
            x: (sx - this.viewportWidth / 2) / this.zoom + this.x,
            y: (sy - this.viewportHeight / 2) / this.zoom + this.y
        };
    }

    // Apply transform to Context
    apply(ctx) {
        ctx.save();
        ctx.translate(this.viewportWidth / 2, this.viewportHeight / 2);
        ctx.scale(this.zoom, this.zoom);
        ctx.translate(-this.x, -this.y);
    }

    restore(ctx) {
        ctx.restore();
    }
}


// --- js/settings.js ---
class Settings {
    constructor() {
        this.fxEnabled = false; // Default to OFF for performance
        this.audioEnabled = true;
        this.load();
    }

    load() {
        const data = localStorage.getItem('jelly_settings');
        if (data) {
            const parsed = JSON.parse(data);
            this.fxEnabled = parsed.fxEnabled;
            this.audioEnabled = parsed.audioEnabled;
        }
    }

    save() {
        localStorage.setItem('jelly_settings', JSON.stringify({
            fxEnabled: this.fxEnabled,
            audioEnabled: this.audioEnabled
        }));
    }

    toggleFX() {
        this.fxEnabled = !this.fxEnabled;
        this.save();
        return this.fxEnabled;
    }

    toggleAudio() {
        this.audioEnabled = !this.audioEnabled;
        this.save();
        return this.audioEnabled;
    }
}


// --- js/assets.js ---
class AssetGenerator {
    constructor() {
        this.cache = {};
    }

    get(key) {
        if (!this.cache[key]) {
            this.cache[key] = this.generate(key);
        }
        return this.cache[key];
    }

    generate(key) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        if (key === 'giant_worm') {
            canvas.width = 500;
            canvas.height = 200;
            // Draw a segmented worm silhouette
            ctx.fillStyle = 'rgba(20, 40, 60, 0.4)';
            ctx.filter = 'blur(10px)'; // Blur once during generation

            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.arc(50 + i * 40, 100, 40 - i * 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        else if (key === 'giant_jelly') {
            canvas.width = 400;
            canvas.height = 600;
            ctx.fillStyle = 'rgba(30, 50, 70, 0.3)';
            ctx.filter = 'blur(15px)';

            // Head
            ctx.beginPath();
            ctx.arc(200, 150, 100, Math.PI, 0);
            ctx.fill();

            // Tentacles
            ctx.lineWidth = 20;
            ctx.strokeStyle = 'rgba(30, 50, 70, 0.2)';
            for(let i=0; i<5; i++) {
                ctx.beginPath();
                ctx.moveTo(120 + i*40, 150);
                ctx.quadraticCurveTo(120 + i*40 + (Math.random()-0.5)*50, 400, 120 + i*40, 550);
                ctx.stroke();
            }
        }
        else if (key === 'god_rays') {
            canvas.width = 800;
            canvas.height = 800;

            // Radial Gradient Rays
            const grad = ctx.createRadialGradient(400, 400, 0, 400, 400, 400);
            grad.addColorStop(0, 'rgba(0, 255, 255, 0.05)');
            grad.addColorStop(0.5, 'rgba(0, 200, 255, 0.02)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = grad;
            // Draw Star/Ray shape
            for(let i=0; i<8; i++) {
                ctx.save();
                ctx.translate(400, 400);
                ctx.rotate(i * (Math.PI / 4));
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(100, -400);
                ctx.lineTo(-100, -400);
                ctx.fill();
                ctx.restore();
            }
        }

        return canvas;
    }
}


// --- js/renderer.js ---


class Renderer {
    constructor(ctx, camera, settings) {
        this.ctx = ctx;
        this.camera = camera;
        this.settings = settings;
    }

    drawCreature(creature, headAngle = 0) {
        // Enable Additive Blending for "Bioluminescent" look if enabled
        if (this.settings.fxEnabled) this.ctx.globalCompositeOperation = 'lighter';

        const points = creature.points;
        let color = creature.color || '#00ffff';

        // Diegetic Health: Modulate color/intensity
        const healthPct = creature.gameStats.health / creature.gameStats.maxHealth;

        // Flash Red on Damage
        if (creature.lastDamageTime && Date.now() - creature.lastDamageTime < 200) {
            color = '#ff0000';
        } else if (healthPct < 0.3) {
            // Pulse Red when low
            const pulse = Math.sin(Date.now() * 0.01) * 0.5 + 0.5;
            color = pulse > 0.5 ? '#ff0000' : color;
        }

        for (let i = points.length - 1; i >= 0; i--) {
            const p = points[i];

            // Glow intensity based on health
            const glowSize = 2.5 * (0.5 + 0.5 * healthPct);

            // Glow
            const grad = this.ctx.createRadialGradient(p.x, p.y, p.radius * 0.2, p.x, p.y, p.radius * glowSize);
            grad.addColorStop(0, color);
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

            this.ctx.fillStyle = grad;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.radius * 2.5, 0, Math.PI * 2);
            this.ctx.fill();

            // Core
            this.ctx.fillStyle = 'white'; // White core for brightness
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.radius * 0.6, 0, Math.PI * 2);
            this.ctx.fill();
        }

        // Draw Attached Parts
        if (creature.parts) {
            creature.parts.forEach(part => {
                const bone = creature.points[part.boneIndex];
                if (!bone) return;

                const prev = creature.points[part.boneIndex - 1] || creature.points[part.boneIndex + 1];
                let spineAngle = 0;
                if (prev) {
                    spineAngle = Math.atan2(bone.y - prev.y, bone.x - prev.x);
                    if (part.boneIndex === 0) spineAngle += Math.PI;
                }

                // Initialize IK for Tentacles if missing
                if (part.type === 'Tentacle' && !part.ik) {
                    part.ik = IKSystem.createTentacle(8, 10);
                }

                this.drawPart(part, bone.x, bone.y, spineAngle, bone.radius, color);
            });
        }

        // Reset composite before drawing eyes (eyes should be solid)
        this.ctx.globalCompositeOperation = 'source-over';

        // Draw Eyes (Head)
        const head = points[0];
        const scale = head.radius / (head.baseRadius || 20);

        this.ctx.save();
        this.ctx.translate(head.x, head.y);
        this.ctx.rotate(headAngle);
        this.ctx.scale(scale, scale);

        this.ctx.fillStyle = 'white';
        this.ctx.beginPath();
        this.ctx.arc(10, -8, 6, 0, Math.PI*2);
        this.ctx.arc(10, 8, 6, 0, Math.PI*2);
        this.ctx.fill();
        this.ctx.fillStyle = 'black';
        this.ctx.beginPath();
        this.ctx.arc(13, -8, 3, 0, Math.PI*2);
        this.ctx.arc(13, 8, 3, 0, Math.PI*2);
        this.ctx.fill();
        this.ctx.restore();
    }

    drawPart(part, x, y, spineAngle, radius, bodyColor) {
        const type = part.type;
        const side = part.side;

        // Special handling for Tentacles (World Space Drawing via IK)
        if (type === 'Tentacle' && part.ik) {
            // Calculate Attachment Point
            let sideAngle = 0;
            if (side === 1) sideAngle = Math.PI/2;
            else if (side === -1) sideAngle = -Math.PI/2;

            const attachAngle = spineAngle + sideAngle;
            const rootX = x + Math.cos(attachAngle) * radius;
            const rootY = y + Math.sin(attachAngle) * radius;

            // Update IK
            IKSystem.update(part.ik, rootX, rootY, attachAngle, 0.016);

            // Draw
            this.ctx.save(); // Just in case, though IK draws world space
            this.ctx.strokeStyle = '#a0f';
            this.ctx.lineWidth = Math.max(2, radius * 0.3);
            if (this.settings.fxEnabled) {
                this.ctx.shadowColor = '#a0f';
                this.ctx.shadowBlur = 10;
            }

            this.ctx.beginPath();
            const segs = part.ik.segments;
            this.ctx.moveTo(segs[0].x, segs[0].y);
            for(let i=1; i<segs.length; i++) {
                this.ctx.lineTo(segs[i].x, segs[i].y);
            }
            this.ctx.stroke();
            this.ctx.shadowBlur = 0;

            // Bulb
            const tip = segs[segs.length-1];
            this.ctx.fillStyle = '#d0f';
            this.ctx.beginPath();
            this.ctx.arc(tip.x, tip.y, radius * 0.2, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.restore();
            return;
        }

        // Standard Parts (Relative Drawing)
        this.ctx.save();
        this.ctx.translate(x, y);

        let sideAngle = 0;
        if (side === 1) sideAngle = Math.PI/2;
        else if (side === -1) sideAngle = -Math.PI/2;
        else if (side === 2) sideAngle = Math.PI; // Nose/Tail Tip

        this.ctx.rotate(spineAngle + sideAngle);

        const wobble = Math.sin(Date.now() * 0.005) * 0.1;
        this.ctx.rotate(wobble);

        this.ctx.translate(radius, 0);

        // Scale Part based on Bone Radius (Base Radius is approx 20)
        const scale = Math.max(0.5, radius / 20);
        this.ctx.scale(scale, scale);

        if (type === 'Fin') {
            this.ctx.fillStyle = bodyColor;
            if (this.settings.fxEnabled) {
                this.ctx.shadowColor = bodyColor;
                this.ctx.shadowBlur = 20;
            }
            this.ctx.beginPath();
            this.ctx.moveTo(0, 0);
            this.ctx.quadraticCurveTo(15, -15, 40, 0);
            this.ctx.quadraticCurveTo(15, 15, 0, 0);
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
        } else if (type === 'Spike') {
            this.ctx.fillStyle = '#ff0044';
            if (this.settings.fxEnabled) {
                this.ctx.shadowColor = '#f04';
                this.ctx.shadowBlur = 15;
            }
            this.ctx.beginPath();
            this.ctx.moveTo(0, -8);
            this.ctx.lineTo(35, 0);
            this.ctx.lineTo(0, 8);
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
        } else if (type === 'Jaws') {
            this.ctx.fillStyle = '#eee';
            this.ctx.beginPath();
            this.ctx.moveTo(0, -10); this.ctx.lineTo(25, -5); this.ctx.lineTo(0, 0);
            this.ctx.moveTo(0, 10); this.ctx.lineTo(25, 5); this.ctx.lineTo(0, 0);
            this.ctx.fill();
            this.ctx.fillStyle = '#fff';
            this.ctx.beginPath();
            this.ctx.moveTo(10, -5); this.ctx.lineTo(15, -2); this.ctx.lineTo(20, -5);
            this.ctx.moveTo(10, 5); this.ctx.lineTo(15, 2); this.ctx.lineTo(20, 5);
            this.ctx.fill();
        } else if (type === 'FilterMouth') {
            this.ctx.fillStyle = '#4f4';
            this.ctx.beginPath();
            // Fan shape
            this.ctx.arc(0, 0, 20, -Math.PI/3, Math.PI/3);
            this.ctx.lineTo(0, 0);
            this.ctx.fill();
            // Gills lines
            this.ctx.strokeStyle = '#040';
            this.ctx.lineWidth = 1;
            this.ctx.beginPath();
            for(let i=-2; i<=2; i++) {
                this.ctx.moveTo(0,0);
                this.ctx.lineTo(15, i*5);
            }
            this.ctx.stroke();
        } else if (type === 'Eye') {
            this.ctx.rotate(side === 1 ? -Math.PI/2 : Math.PI/2);
            this.ctx.fillStyle = 'white';
            this.ctx.beginPath();
            this.ctx.arc(12, 0, 6, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.fillStyle = 'black';
            this.ctx.beginPath();
            this.ctx.arc(14, 0, 2, 0, Math.PI*2);
            this.ctx.fill();
        } else if (type === 'Shield') {
            this.ctx.fillStyle = '#444';
            this.ctx.strokeStyle = '#888';
            this.ctx.lineWidth = 2;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, 20, -Math.PI/2, Math.PI/2);
            this.ctx.lineTo(0, 0);
            this.ctx.fill();
            this.ctx.stroke();
        } else if (type === 'Booster') {
            this.ctx.fillStyle = '#555';
            this.ctx.beginPath();
            this.ctx.moveTo(0, -5);
            this.ctx.lineTo(15, -8);
            this.ctx.lineTo(15, 8);
            this.ctx.lineTo(0, 5);
            this.ctx.fill();
            if (Math.random() > 0.5) {
                this.ctx.fillStyle = '#fa0';
                this.ctx.beginPath();
                this.ctx.moveTo(15, -5);
                this.ctx.lineTo(25 + Math.random()*10, 0);
                this.ctx.lineTo(15, 5);
                this.ctx.fill();
            }
        } else if (type === 'Poison') {
            this.ctx.fillStyle = '#0f0';
            if (this.settings.fxEnabled) {
                this.ctx.shadowColor = '#0f0';
                this.ctx.shadowBlur = 15;
            }
            this.ctx.beginPath();
            this.ctx.arc(10, 0, 8, 0, Math.PI*2);
            this.ctx.fill();
            this.ctx.shadowBlur = 0;
            this.ctx.fillStyle = 'rgba(255,255,255,0.5)';
            this.ctx.beginPath();
            this.ctx.arc(12 - Math.random()*4, -2 + Math.random()*4, 2, 0, Math.PI*2);
            this.ctx.fill();
        }

        this.ctx.restore();
    }
}


// --- js/save_manager.js ---
class SaveManager {
    constructor(game) {
        this.game = game;
        this.key = 'jelly_evolution_save_v1';
    }

    save() {
        const data = {
            dna: this.game.creature.gameStats.dna,
            mass: this.game.creature.gameStats.mass,
            health: this.game.creature.gameStats.health,
            maxHealth: this.game.creature.gameStats.maxHealth,
            parts: this.game.creature.parts,
            color: this.game.creature.color || '#00ffff' // Default color if not set
        };
        localStorage.setItem(this.key, JSON.stringify(data));
        console.log("Game Saved", data);
    }

    load() {
        const saved = localStorage.getItem(this.key);
        if (saved) {
            try {
                const data = JSON.parse(saved);
                this.game.creature.gameStats.dna = data.dna || 0;
                this.game.creature.gameStats.mass = data.mass || 10;
                this.game.creature.gameStats.health = data.health || 100;
                this.game.creature.gameStats.maxHealth = data.maxHealth || 100;
                this.game.creature.parts = data.parts || [];
                this.game.creature.color = data.color || '#00ffff';

                // Recalculate stats based on loaded parts
                this.game.creature.stats.calculate(this.game.creature.parts);
                console.log("Game Loaded", data);
                return true;
            } catch (e) {
                console.error("Failed to load save", e);
                return false;
            }
        }
        return false;
    }

    reset() {
        localStorage.removeItem(this.key);
    }
}

    },

        unlocked: false,
        cost: 60
    }

class Progression {
    constructor(saveManager) {
        this.saveManager = saveManager;
        this.unlocked = ['Fin', 'Spike', 'Eye', 'Jaws', 'FilterMouth']; // Start with basics
        this.load();
    }

    load() {
        const saved = localStorage.getItem('jelly_unlocks');
        if (saved) {
            this.unlocked = JSON.parse(saved);
        }
        // Sync with DB
        this.unlocked.forEach(key => {
            if(PARTS_DB[key]) PARTS_DB[key].unlocked = true;
        });
    }

    save() {
        localStorage.setItem('jelly_unlocks', JSON.stringify(this.unlocked));
    }

    unlock(key) {
        if (!this.unlocked.includes(key) && PARTS_DB[key]) {
            this.unlocked.push(key);
            PARTS_DB[key].unlocked = true;
            this.save();
            return true;
        }
        return false;
    }

    isUnlocked(key) {
        return this.unlocked.includes(key);
    }

    getAvailableParts() {
        return Object.keys(PARTS_DB).filter(k => this.unlocked.includes(k));
    }

    checkDrop(enemyType, difficulty) {
        // Chance to unlock based on enemy
        const chance = 0.3; // 30% drop chance
        if (Math.random() > chance) return null;

        // Determine potential drop based on difficulty/type
        let potential = [];
        if (difficulty > 2) potential.push('Tentacle');
        if (difficulty > 4) potential.push('Shield');
        if (difficulty > 6) potential.push('Booster');
        if (difficulty > 8) potential.push('Poison');

        // Filter out already unlocked
        potential = potential.filter(p => !this.unlocked.includes(p));

        if (potential.length > 0) {
            const drop = potential[Math.floor(Math.random() * potential.length)];
            return drop;
        }
        return null;
    }
}




// --- js/input.js ---

class Input {
    constructor() {
        this.active = false;
        this.startX = 0;
        this.startY = 0;
        this.currX = 0;
        this.currY = 0;
        this.angle = 0;
        this.distance = 0;
        this.maxDistance = 50;

        this.lastTap = 0;
        this.doubleTapDetected = false;

        this.setupListeners();
    }

    setupListeners() {
        const target = window;

        target.addEventListener('touchstart', (e) => {
            if(e.target.tagName === 'CANVAS') e.preventDefault();
            this.handleStart(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        target.addEventListener('touchmove', (e) => {
            if(e.target.tagName === 'CANVAS') e.preventDefault();
            this.handleMove(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        target.addEventListener('touchend', (e) => {
            this.handleEnd();
        });

        target.addEventListener('mousedown', (e) => this.handleStart(e.clientX, e.clientY));
        target.addEventListener('mousemove', (e) => this.handleMove(e.clientX, e.clientY));
        target.addEventListener('mouseup', () => this.handleEnd());
    }

    handleStart(x, y) {
        this.active = true;
        this.startX = x;
        this.startY = y;
        this.currX = x;
        this.currY = y;
        this.distance = 0;

        const now = Date.now();
        if (now - this.lastTap < 300) {
            this.doubleTapDetected = true;
        }
        this.lastTap = now;
    }

    handleMove(x, y) {
        if (!this.active) return;
        this.currX = x;
        this.currY = y;
        const dx = x - this.startX;
        const dy = y - this.startY;
        this.angle = Math.atan2(dy, dx);
        this.distance = Math.min(Math.hypot(dx, dy), this.maxDistance);
    }

    handleEnd() {
        this.active = false;
        this.distance = 0;
    }

    getVector() {
        if (!this.active) return { x: 0, y: 0 };
        const force = this.distance / this.maxDistance;
        return {
            x: Math.cos(this.angle) * force,
            y: Math.sin(this.angle) * force
        };
    }

    checkDoubleTap() {
        if (this.doubleTapDetected) {
            this.doubleTapDetected = false;
            return true;
        }
        return false;
    }
}


// --- js/enemy.js ---


class Enemy {
    constructor(x, y, difficulty, physics, type = 'hunter') {
        this.physics = physics;
        this.active = true;
        this.difficulty = difficulty; // 1 to 10+
        this.type = type; // 'hunter', 'grazer', 'titan'

        // AI & Tier Props
        this.tier = 1; // Default
        this.mass = 10; // Default approximation
        this.persistent = false; // Flag to prevent despawning

        // Procedural Generation
        this.scale = 1 + (difficulty * 0.2); // Growth
        this.color = type === 'grazer' ? `hsl(${100 + Math.random() * 50}, 70%, 50%)` : `hsl(${Math.random() * 360}, 70%, 50%)`;

        // Body
        this.points = [];
        this.constraints = [];
        this.parts = [];

        // Stats
        this.stats = new Stats();
        this.createBody(x, y);
        this.generateParts();
        this.stats.calculate(this.parts);

        // Base stats scaling
        this.stats.speed = (300 + difficulty * 50) * (type === 'grazer' ? 0.8 : 1.0);
        this.stats.damage = 5 + difficulty * 2;
        this.health = (20 + difficulty * 10) * (type === 'titan' ? 5 : 1);
        this.maxHealth = this.health;

        // Mass approximation for AI logic
        this.mass = 10 * this.scale * this.scale;

        // AI State
        this.state = 'wander';
        this.targetX = x;
        this.targetY = y;
        this.stateTimer = 0;

        // Flocking
        this.flockId = -1;
    }

    createBody(x, y) {
        const segs = this.type === 'titan' ? 10 : (3 + Math.floor(this.difficulty / 3));
        const rad = 15 * this.scale * (this.type === 'titan' ? 2 : 1);

        for (let i = 0; i < segs; i++) {
            const p = this.physics.constructor.createPoint(x, y + i * rad, rad * (1 - i*0.1), 1 + this.difficulty * 0.5);
            p.baseRadius = rad * (1 - i*0.1);
            this.points.push(p);

            if (i > 0) {
                const prev = this.points[i-1];
                this.constraints.push(this.physics.constructor.createConstraint(prev, p, 0.5, rad));
            }
        }
    }

    generateParts() {
        if (this.type === 'grazer') {
            // Grazers have fins mostly
            this.parts.push({ type: 'Fin', boneIndex: 1, side: 1 });
            this.parts.push({ type: 'Fin', boneIndex: 1, side: -1 });
            return;
        }

        const partCount = Math.floor(this.difficulty);
        let hasWeapon = false;

        // Jaws Chance (Frontal Weapon)
        if (this.type !== 'grazer' && Math.random() > 0.6) {
             this.parts.push({ type: 'Jaws', boneIndex: 0, side: 0 }); // Center head
             hasWeapon = true;
        }

        for(let i=0; i<partCount; i++) {
            let type = Math.random() > 0.5 ? 'Fin' : 'Spike';

            // Force weapon if none yet and last part
            if (!hasWeapon && i === partCount - 1) {
                type = 'Spike';
            }
            if (type === 'Spike') hasWeapon = true;

            const boneIndex = Math.floor(Math.random() * (this.points.length));
            const side = Math.random() > 0.5 ? 1 : -1;

            this.parts.push({ type, boneIndex, side });
        }

        if (Math.random() > 0.3) {
             this.parts.push({ type: 'Eye', boneIndex: 0, side: 1 });
             this.parts.push({ type: 'Eye', boneIndex: 0, side: -1 });
        }
    }

    update(dt, playerHead, playerMass = 10) {
        this.stateTimer -= dt;
        if (this.stateTimer <= 0) this.pickState(playerHead, playerMass);

        let head = this.points[0];
        let dx = 0, dy = 0;

        if (this.state === 'chase') {
            dx = playerHead.x - head.x;
            dy = playerHead.y - head.y;
        } else if (this.state === 'flee') {
            dx = head.x - playerHead.x;
            dy = head.y - playerHead.y;
        } else {
            // Wander
            dx = this.targetX - head.x;
            dy = this.targetY - head.y;
            if (Math.hypot(dx, dy) < 50) this.pickState(playerHead, playerMass);
        }

        const dist = Math.hypot(dx, dy);
        if (dist > 0) {
            const force = this.stats.speed * dt * dt;
            const weight = this.type === 'grazer' ? 0.3 : 1.0;

            head.x += (dx / dist) * force * weight;
            head.y += (dy / dist) * force * weight;
        }

        this.physics.update(this.points, this.constraints, dt);
    }

    pickState(playerHead, playerMass) {
        this.stateTimer = 1.0 + Math.random();

        const head = this.points[0];
        const dist = Math.hypot(playerHead.x - head.x, playerHead.y - head.y);
        const aggroRange = (this.persistent ? 2000 : 800) * this.scale; // Persistent (Apex) has huge aggro

        // Decision Logic
        // 1. Health Critical? -> Flee
        if (this.health < this.maxHealth * 0.3 && !this.persistent) {
            this.state = 'flee';
            this.color = '#ffaa00'; // Fear color
            return;
        }

        // 2. Player Nearby?
        if (dist < aggroRange || this.persistent) { // Apex always chases if persistent
            if (this.type === 'grazer') {
                this.state = 'flee';
            } else if (this.type === 'titan' || this.persistent) {
                this.state = 'chase';
            } else {
                // Hunter: Compare Mass
                if (playerMass > this.mass * 1.5) {
                    this.state = 'flee';
                } else if (playerMass < this.mass * 0.8) {
                    this.state = 'chase';
                } else {
                    if (Math.random() > 0.5) this.state = 'chase';
                    else this.state = 'wander';
                }
            }
        } else {
            this.state = 'wander';
            this.targetX = head.x + (Math.random()-0.5) * 1000;
            this.targetY = head.y + (Math.random()-0.5) * 1000;
        }
    }

    // Called when damaged
    onHit(sourceX, sourceY) {
        // Counter attack logic
        this.health -= 10;
        if (this.health > 0 && this.type !== 'grazer') {
            this.state = 'chase'; // Aggro
            this.stateTimer = 5.0; // Focus on player
        }
    }

    render(ctx) {
        if (!this.active) return;

        ctx.save();

        // Body
        for (let i = this.points.length - 1; i >= 0; i--) {
            const p = this.points[i];
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
            ctx.fill();
        }

        // Parts
        this.parts.forEach(part => {
             const bone = this.points[part.boneIndex];
             if(!bone) return;

             ctx.save();
             ctx.translate(bone.x, bone.y);

             const prev = this.points[part.boneIndex-1] || this.points[part.boneIndex+1];
             let ang = 0;
             if (prev) {
                 ang = Math.atan2(bone.y - prev.y, bone.x - prev.x);
                 if (part.boneIndex === 0) ang += Math.PI;
             }

             let sideAngle = 0;
             if (part.side === 1) sideAngle = Math.PI/2;
             else if (part.side === -1) sideAngle = -Math.PI/2;

             ctx.rotate(ang + sideAngle);
             ctx.translate(bone.radius, 0);

             if(part.type === 'Fin') {
                 ctx.fillStyle = '#fff';
                 ctx.globalAlpha = 0.5;
                 ctx.beginPath();
                 ctx.moveTo(0,0); ctx.lineTo(15, -10); ctx.lineTo(30, 0);
                 ctx.fill();
             } else if (part.type === 'Spike') {
                 ctx.fillStyle = '#f00';
                 ctx.beginPath();
                 ctx.moveTo(0, -5); ctx.lineTo(20, 0); ctx.lineTo(0, 5);
                 ctx.fill();
             } else if (part.type === 'Jaws') {
                 ctx.fillStyle = '#ccc';
                 ctx.beginPath();
                 ctx.moveTo(0, -10); ctx.lineTo(20, -5); ctx.lineTo(0, 0);
                 ctx.moveTo(0, 10); ctx.lineTo(20, 5); ctx.lineTo(0, 0);
                 ctx.fill();
             } else if (part.type === 'Eye') {
                 ctx.fillStyle = '#fff';
                 ctx.beginPath();
                 ctx.arc(5, 0, 4, 0, Math.PI*2);
                 ctx.fill();
                 ctx.fillStyle = '#000';
                 ctx.beginPath();
                 ctx.arc(6, 0, 2, 0, Math.PI*2);
                 ctx.fill();
             }
             ctx.restore();
        });

        ctx.restore();
    }
}


// --- js/boids.js ---


class BoidManager {
    constructor(physics) {
        this.physics = physics;
        this.flocks = [];
    }

    createFlock(x, y, count, difficulty, type = 'grazer') {
        const flock = [];
        const flockId = Math.floor(Math.random() * 10000);
        for (let i = 0; i < count; i++) {
            // Spawn close to center
            const ex = x + (Math.random() - 0.5) * 200;
            const ey = y + (Math.random() - 0.5) * 200;
            const enemy = new Enemy(ex, ey, difficulty, this.physics, type);
            enemy.flockId = flockId;
            flock.push(enemy);
        }
        this.flocks.push(flock);
        return flock;
    }

    update(dt, enemies) {
        const separationDist = 80;
        const cohesionDist = 200;

        enemies.forEach(e => {
            if (e.type !== 'grazer') return;

            let sepX = 0, sepY = 0;
            let cohX = 0, cohY = 0;
            let count = 0;

            const head = e.points[0];

            enemies.forEach(other => {
                if (e === other || other.type !== 'grazer') return;
                // Only flock with same flockId? Or all grazers? Let's say all grazers for now, or use flockId if we want distinct groups.
                // Using flockId makes them stay in their spawn groups.
                if (e.flockId !== other.flockId) return;

                const otherHead = other.points[0];
                const dist = Math.hypot(head.x - otherHead.x, head.y - otherHead.y);

                if (dist < cohesionDist) {
                    // Separation
                    if (dist < separationDist && dist > 0) {
                        sepX += (head.x - otherHead.x) / dist; // Push away
                        sepY += (head.y - otherHead.y) / dist;
                    }

                    // Cohesion
                    cohX += otherHead.x;
                    cohY += otherHead.y;

                    count++;
                }
            });

            if (count > 0) {
                // Apply forces (Soft Body impulse)
                const sepForce = 8000; // Strong separation
                head.x += sepX * sepForce * dt * dt;
                head.y += sepY * sepForce * dt * dt;

                // Cohesion
                cohX /= count;
                cohY /= count;
                const cohDirX = cohX - head.x;
                const cohDirY = cohY - head.y;
                const cohForce = 200;

                head.x += cohDirX * cohForce * dt * dt;
                head.y += cohDirY * cohForce * dt * dt;
            }
        });
    }
}

class Debris {
    constructor(points, constraints, color, life = 5) {
        this.points = points;
        this.constraints = constraints;
        this.color = color;
        this.life = life;
        this.active = true;

        // Tearing: Remove random constraints to simulate destruction
        if (this.constraints.length > 2) {
            const removeCount = Math.ceil(this.constraints.length * 0.4);
            for(let i=0; i<removeCount; i++) {
                const idx = Math.floor(Math.random() * this.constraints.length);
                this.constraints.splice(idx, 1);
            }
        }

        // Explosion Impulse
        const center = this.getCenter();
        this.points.forEach(p => {
             const dx = p.x - center.x;
             const dy = p.y - center.y;
             const dist = Math.hypot(dx, dy) || 1;
             const force = 100 * Math.random();
             p.oldx -= (dx/dist) * force * 0.016; // Impulse
             p.oldy -= (dy/dist) * force * 0.016;
        });
    }

    getCenter() {
        let x=0, y=0;
        this.points.forEach(p => { x+=p.x; y+=p.y; });
        return { x: x/this.points.length, y: y/this.points.length };
    }

    update(dt, physics) {
        physics.update(this.points, this.constraints, dt);
        this.life -= dt;
        if (this.life <= 0) this.active = false;

        // Fade out shrinking
        if (this.life < 2) {
             this.constraints.forEach(c => c.length *= 0.99);
             this.points.forEach(p => p.radius *= 0.99);
        }
    }

    render(ctx) {
        if (!this.active) return;
        ctx.save();
        ctx.globalAlpha = Math.min(1, this.life * 0.5); // Start semi-transparent

        // Render blobs around constraints
        ctx.strokeStyle = this.color;
        ctx.lineCap = 'round';

        this.constraints.forEach(c => {
            ctx.lineWidth = (c.p1.radius + c.p2.radius) * 0.8;
            ctx.beginPath();
            ctx.moveTo(c.p1.x, c.p1.y);
            ctx.lineTo(c.p2.x, c.p2.y);
            ctx.stroke();
        });

        ctx.restore();
    }
}


// --- js/ik.js ---
// Procedural Animation System (Inverse Kinematics)

class IKSystem {
    // Verlet Integration for smooth, organic tentacle movement
    // No strict FABRIK, but a physics-based chain simulation perfect for "Jelly" feel.

    constructor() {}

    static createTentacle(length = 8, segmentLength = 10) {
        let segments = [];
        for (let i = 0; i < length; i++) {
            // Initialize points with velocity storage (oldX/oldY)
            segments.push({ x: 0, y: 0, oldX: 0, oldY: 0 });
        }
        return { segments, segmentLength };
    }

    static update(tentacle, rootX, rootY, angleOffset, dt) {
        const segments = tentacle.segments;
        if (!segments || segments.length === 0) return;

        // 1. Move Root to Bone Position
        const root = segments[0];
        root.x = rootX;
        root.y = rootY;

        // If this is the first frame (or reset), init all segments to root to avoid explosion
        if (segments[1].x === 0 && segments[1].y === 0) {
             for(let i=1; i<segments.length; i++) {
                 segments[i].x = rootX; segments[i].y = rootY;
                 segments[i].oldX = rootX; segments[i].oldY = rootY;
             }
        }

        // 2. Physics Simulation (Verlet Integration)
        const drag = 0.9;
        const time = Date.now() * 0.003;

        for (let i = 1; i < segments.length; i++) {
            const p = segments[i];

            // Calculate Velocity
            const vx = (p.x - p.oldX) * drag;
            const vy = (p.y - p.oldY) * drag;

            // Store current as old for next frame
            p.oldX = p.x;
            p.oldY = p.y;

            // Apply Velocity
            p.x += vx;
            p.y += vy;

            // Add Procedural Wave Motion (Sine Wave perpendicular to tentacle direction)
            const wave = Math.sin(time + i * 0.5) * (i * 0.5);

            const pX = Math.cos(angleOffset + Math.PI/2);
            const pY = Math.sin(angleOffset + Math.PI/2);

            p.x += pX * wave * dt * 60;
            p.y += pY * wave * dt * 60;
        }

        // 3. Constrain Lengths (Relaxation Solver)
        const iterations = 5;
        const segLen = tentacle.segmentLength;

        for (let k = 0; k < iterations; k++) {
            segments[0].x = rootX;
            segments[0].y = rootY;

            for (let i = 0; i < segments.length - 1; i++) {
                const a = segments[i];
                const b = segments[i+1];

                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const dist = Math.hypot(dx, dy);

                if (dist === 0) continue;

                const diff = (dist - segLen) / dist;

                const ox = dx * diff * 0.5;
                const oy = dy * diff * 0.5;

                if (i !== 0) {
                     a.x += ox;
                     a.y += oy;
                }
                b.x -= ox;
                b.y -= oy;
            }
        }
    }
}


// --- js/lighting.js ---
class Lighting {
    constructor(canvas, settings) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.settings = settings;

        // Offscreen canvas for lighting map
        // Optimization: Low Resolution for Lighting (0.25x)
        this.scale = 0.25;
        this.lightCanvas = document.createElement('canvas');
        this.lightCtx = this.lightCanvas.getContext('2d');
        this.resize(canvas.width, canvas.height);
    }

    resize(w, h) {
        this.lightCanvas.width = Math.ceil(w * this.scale);
        this.lightCanvas.height = Math.ceil(h * this.scale);
    }

    update(camera, entities) {
        if (!this.settings.fxEnabled) return;

        const w = this.lightCanvas.width;
        const h = this.lightCanvas.height;

        // 1. Fill with Ambient Darkness (Deep Abyss)
        // Made lighter to reveal parallax background (#1a1a33 instead of #000818)
        this.lightCtx.globalCompositeOperation = 'source-over';
        this.lightCtx.fillStyle = '#1a1a33';
        this.lightCtx.fillRect(0, 0, w, h);

        // 2. Add Lights (Lighter Mode)
        this.lightCtx.globalCompositeOperation = 'lighter';

        const s = this.scale; // Scale factor for coordinates

        // Player Light
        const pHead = entities.player.points[0];
        if (pHead) {
            const screenPos = camera.worldToScreen(pHead.x, pHead.y);
            const radius = Math.max(10, pHead.radius * camera.zoom * 6);
            this.drawLight(screenPos.x * s, screenPos.y * s, radius * s, '#44ffff');
        }

        // Enemies
        entities.enemies.forEach(e => {
            if (!e.active || !e.points || !e.points[0]) return;
            const head = e.points[0];
            const screenPos = camera.worldToScreen(head.x, head.y);

            // Optimization: Skip if off-screen (Bounds check adjusted for scale)
            if (screenPos.x < -100 || screenPos.x > this.canvas.width + 100 || screenPos.y < -100 || screenPos.y > this.canvas.height + 100) return;

            const radius = Math.max(10, head.radius * camera.zoom * 4);
            this.drawLight(screenPos.x * s, screenPos.y * s, radius * s, e.color);
        });

        // Food (Small lights)
        entities.food.forEach(f => {
            const screenPos = camera.worldToScreen(f.x, f.y);
            if (screenPos.x < -20 || screenPos.x > this.canvas.width + 20 || screenPos.y < -20 || screenPos.y > this.canvas.height + 20) return;

            const radius = Math.max(5, f.radius * camera.zoom * 3);
            this.drawLight(screenPos.x * s, screenPos.y * s, radius * s, f.color);
        });
    }

    drawLight(x, y, radius, color) {
        const grad = this.lightCtx.createRadialGradient(x, y, 0, x, y, radius);
        grad.addColorStop(0, color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');

        this.lightCtx.fillStyle = grad;
        this.lightCtx.beginPath();
        this.lightCtx.arc(x, y, radius, 0, Math.PI * 2);
        this.lightCtx.fill();
    }

    render(mainCtx) {
        const w = this.canvas.width;
        const h = this.canvas.height;

        if (this.settings.fxEnabled) {
            mainCtx.save();
            mainCtx.globalCompositeOperation = 'multiply';
            // Scale up the low-res light map
            mainCtx.imageSmoothingEnabled = true; // Smooth the low-res
            mainCtx.drawImage(this.lightCanvas, 0, 0, w, h);
            mainCtx.restore();
        }

        // Vignette (Atmosphere) - Reduced opacity to 0.5 to show depth
        mainCtx.save();
        mainCtx.globalCompositeOperation = 'source-over';
        const grad = mainCtx.createRadialGradient(w/2, h/2, h*0.4, w/2, h/2, h*1.0);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,0.5)');

        mainCtx.fillStyle = grad;
        mainCtx.fillRect(0, 0, w, h);
        mainCtx.restore();
    }
}

class BiomeManager {
    constructor(game) {
        this.game = game;

        // Define Biomes
        this.biomes = [
            {
                name: "The Shallows",
                color: "#001020", // Deep Blue
                particles: "#aaffff",
                hazard: null,
                enemyTypes: ['hunter', 'grazer'],
                depthStart: 0
            },
            {
                name: "Algae Forest",
                color: "#001810", // Dark Greenish
                particles: "#00ff88",
                hazard: "obscure", // Fog
                enemyTypes: ['grazer', 'hunter'], // More grazers
                depthStart: 2000
            },
            {
                name: "Thermal Vents",
                color: "#180500", // Dark Red
                particles: "#ff4400",
                hazard: "current", // Push force
                enemyTypes: ['hunter', 'titan'],
                depthStart: 5000
            },
            {
                name: "The Void",
                color: "#050010", // Purple Black
                particles: "#aa00ff",
                hazard: "void",
                enemyTypes: ['titan', 'titan'], // Only big stuff
                depthStart: 10000
            }
        ];
    }

    getCurrentBiome(x, y) {
        // Biomes are radial based on distance from origin (Depth)
        // Or perlin noise? User asked for "Infinite Map".
        // Distance-based is easiest for infinite progression feeling.
        const dist = Math.hypot(x, y);

        // Find deepest biome that matches distance
        for (let i = this.biomes.length - 1; i >= 0; i--) {
            if (dist >= this.biomes[i].depthStart) {
                return this.biomes[i];
            }
        }
        return this.biomes[0];
    }

    update(dt, player) {
        const head = player.points[0];
        const biome = this.getCurrentBiome(head.x, head.y);

        // Apply Hazards
        if (biome.hazard === 'current') {
            // Push player in random direction (simulating turbulence)
            const time = Date.now() * 0.001;
            const forceX = Math.cos(time) * 1000;
            const forceY = Math.sin(time) * 1000;

            // Only apply to body points
            player.points.forEach(p => {
                p.x += forceX * dt * dt;
                p.y += forceY * dt * dt;
            });
        }

        // Return biome info for renderer/spawner
        return biome;
    }
}

// Legacy System (Roguelite Progression)

const LEGACY_UPGRADES = {
    'StartSize': { name: 'Cell Division', desc: 'Start with more mass.', cost: 100, max: 5 },
    'Speed': { name: 'Flagella Boost', desc: 'Permanent +5% Speed.', cost: 150, max: 10 },
    'Vision': { name: 'Compound Eyes', desc: 'Permanent +10% View Distance.', cost: 200, max: 5 },
    'Efficiency': { name: 'Metabolism', desc: 'Food gives +10% more DNA.', cost: 300, max: 5 }
};

class LegacyManager {
    constructor() {
        this.legacyDNA = 0;
        this.upgrades = {};
        this.load();
    }

    load() {
        const saved = localStorage.getItem('jelly_legacy');
        if (saved) {
            const data = JSON.parse(saved);
            this.legacyDNA = data.dna || 0;
            this.upgrades = data.upgrades || {};
        }
    }

    save() {
        localStorage.setItem('jelly_legacy', JSON.stringify({
            dna: this.legacyDNA,
            upgrades: this.upgrades
        }));
    }

    // Called on Death
    convertMassToLegacy(mass) {
        // Exchange Rate: 10 Mass = 1 Legacy DNA
        const earned = Math.floor(mass / 10);
        this.legacyDNA += earned;
        this.save();
        return earned;
    }

    buyUpgrade(key) {
        const up = LEGACY_UPGRADES[key];
        if (!up) return false;

        const currentLevel = this.upgrades[key] || 0;
        if (currentLevel >= up.max) return false;

        // Cost Scaling: Base * (Level + 1)
        const cost = up.cost * (currentLevel + 1);

        if (this.legacyDNA >= cost) {
            this.legacyDNA -= cost;
            this.upgrades[key] = currentLevel + 1;
            this.save();
            return true;
        }
        return false;
    }

    getBuffs() {
        return {
            startMass: (this.upgrades['StartSize'] || 0) * 5,
            speedMult: 1 + (this.upgrades['Speed'] || 0) * 0.05,
            visionMult: 1 + (this.upgrades['Vision'] || 0) * 0.1,
            dnaMult: 1 + (this.upgrades['Efficiency'] || 0) * 0.1
        };
    }
}
